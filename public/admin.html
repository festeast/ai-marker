<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1 style="margin:0" data-i18n="admin_title"></h1>
      <p class="muted" style="margin:4px 0 0" data-i18n="admin_intro"></p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="row spread">
        <h2 style="margin:0" data-i18n="admin_users"></h2>
        <input type="text" id="search" data-i18n-placeholder="search" style="width:240px">
      </div>
      <div id="users" style="margin-top:12px"></div>
    </div>
    <div class="error" id="err"></div>
  </main>
  <script>
    let users = [];
    const stat = (num, label) => el('div', { class: 'stat' }, el('div', { class: 'num' }, String(num)), el('div', { class: 'muted' }, label));
    const day = (v) => v ? new Date(v).toLocaleDateString('ru-RU') : '—';
    const dayTime = (v) => v ? new Date(v).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const shown = users.filter((u) => !q || [u.email, u.name].some((v) => v && v.toLowerCase().includes(q)));
      const box = document.getElementById('users');
      if (!shown.length) { box.replaceChildren(el('p', { class: 'muted' }, t('nothing_found'))); return; }
      const head = el('tr', {}, ['#', t('admin_user'), t('admin_registered'), t('admin_last_login'), t('exams_count'), t('admin_students'), t('library_materials')].map((h) => el('th', {}, h)));
      const rows = shown.map((u, i) => el('tr', {},
        el('td', { class: 'muted' }, String(i + 1)),
        el('td', {}, el('b', {}, u.name || '—'), u.isAdmin ? el('span', { class: 'badge', style: 'margin-left:6px' }, t('admin_badge')) : null,
          el('br'), el('a', { href: 'mailto:' + u.email }, u.email || '—')),
        el('td', {}, day(u.createdAt)),
        el('td', {}, dayTime(u.lastSignInAt)),
        el('td', {}, String(u.exams)),
        el('td', {}, String(u.participants)),
        el('td', {}, String(u.materials))));
      box.replaceChildren(el('div', { class: 'table-scroll' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
    }

    requireLogin().then(async () => {
      let data;
      try { data = await rpc('admin_users'); } catch (err) {
        if (err.code === 'forbidden') { document.querySelector('main').replaceChildren(el('div', { class: 'card' }, el('h2', {}, t('admin_title')), el('p', {}, t('admin_forbidden')))); return; }
        throw err;
      }
      const s = data.totals;
      document.getElementById('stats').replaceChildren(
        stat(s.users, t('admin_total_users')), stat(s.newUsers7d, t('admin_new_7d')), stat(s.activeUsers7d, t('admin_active_7d')),
        stat(s.exams, t('exams_count')), stat(s.participants, t('admin_students')), stat(s.materials, t('library_materials')));
      users = data.users;
      render();
    }).catch(showPageError);
    document.getElementById('search').addEventListener('input', render);
  </script>
</body>
</html>
