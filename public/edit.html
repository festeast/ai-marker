<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_edit">Редактор — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script>
</head>
<body>
  <main class="wrap">
    <p><a href="teacher.html" data-i18n="back"></a></p>
    <div class="card">
      <label for="title" data-i18n="exam_title"></label>
      <input type="text" id="title">
      <p class="muted" id="type"></p>
      <div id="meta"></div>
    </div>
    <details class="card" id="gen-box">
      <summary><b data-i18n="gen_title"></b></summary>
      <p class="muted" data-i18n="gen_intro"></p>
      <div id="gen"></div>
    </details>
    <div class="card">
      <h2 data-i18n="questions"></h2>
      <div id="questions"></div>
      <button class="secondary" id="add" data-i18n="add_question"></button>
    </div>
    <div class="row">
      <button class="secondary" id="save" data-i18n="save"></button>
      <button id="publish" data-i18n="confirm_publish"></button>
      <button class="danger" id="delete" data-i18n="delete_exam"></button>
      <span id="msg"></span>
    </div>
    <div class="error" id="err"></div>
  </main>
  <script>
    const id = Number(new URLSearchParams(location.search).get('id'));
    let exam;

    function blankQuestion() {
      return exam.type === 'quiz' ? { text: '', options: ['', ''], correctIndex: 0 } : { text: '' };
    }

    function render() {
      const box = document.getElementById('questions');
      box.replaceChildren(...exam.questions.map((q, i) => {
        const text = el('textarea', { rows: 2, style: 'min-height:60px' });
        text.value = q.text;
        text.addEventListener('input', () => { q.text = text.value; });
        const parts = [
          el('div', { class: 'row spread' }, el('b', {}, `${t('question')} ${i + 1}`),
            el('button', { class: 'danger small', onclick: () => { exam.questions.splice(i, 1); render(); } }, t('remove'))),
          text,
        ];
        if (exam.type === 'quiz') {
          q.options.forEach((opt, j) => {
            const input = el('input', { type: 'text', placeholder: `${t('option')} ${j + 1}` });
            input.value = opt;
            input.addEventListener('input', () => { q.options[j] = input.value; });
            const radio = el('input', { type: 'radio', name: 'correct-' + i, title: t('correct') });
            radio.checked = q.correctIndex === j;
            radio.addEventListener('change', () => { q.correctIndex = j; });
            parts.push(el('div', { class: 'option' }, radio, input,
              q.options.length > 2 ? el('button', { class: 'secondary small', onclick: () => {
                q.options.splice(j, 1);
                if (q.correctIndex >= q.options.length) q.correctIndex = 0;
                render();
              } }, '×') : null));
          });
          parts.push(el('p', { class: 'muted' }, '○ = ' + t('correct')));
          parts.push(el('button', { class: 'secondary small', onclick: () => { q.options.push(''); render(); } }, t('add_option')));
        } else {
          const ref = el('textarea', { rows: 2, style: 'min-height:60px', placeholder: t('reference_placeholder') });
          ref.value = q.reference || '';
          ref.addEventListener('input', () => { q.reference = ref.value; });
          parts.push(el('label', {}, t('reference')), ref);
        }
        const points = el('input', { type: 'number', min: 1, max: 100, step: 1, style: 'width:80px' });
        points.value = q.points || 1;
        points.addEventListener('input', () => { q.points = Number(points.value); });
        parts.push(el('label', { class: 'row' }, t('points'), points));
        return el('div', { class: 'question' }, parts);
      }));
    }

    async function save() {
      document.getElementById('err').textContent = '';
      exam.title = document.getElementById('title').value;
      const saved = await rpc('save_exam', { p_exam_id: id, p_title: exam.title, p_questions: exam.questions });
      exam.questions = saved.questions;
      render();
    }

    function withErrors(fn) {
      return async () => {
        try { await fn(); } catch (err) { document.getElementById('err').textContent = err.message; }
      };
    }

    document.getElementById('add').addEventListener('click', () => { exam.questions.push(blankQuestion()); render(); });
    document.getElementById('save').addEventListener('click', withErrors(async () => {
      await save();
      const msg = document.getElementById('msg');
      msg.textContent = t('saved'); msg.className = 'ok';
      setTimeout(() => { msg.textContent = ''; }, 2000);
    }));
    document.getElementById('publish').addEventListener('click', withErrors(async () => {
      await save();
      if (!exam.questions.length) throw new Error(t('err_no_questions'));
      if (!confirm(t('confirm_publish_q'))) return;
      await rpc('publish_exam', { p_exam_id: id });
      location.href = 'monitor.html?id=' + id;
    }));
    document.getElementById('delete').addEventListener('click', withErrors(async () => {
      if (!confirm(t('delete_exam_q'))) return;
      await rpc('delete_exam', { p_exam_id: id });
      location.href = 'teacher.html';
    }));

    // ИИ составляет вопросы по материалу из библиотеки; они добавляются в список, учитель их проверяет и сохраняет.
    async function renderGenerator() {
      const box = document.getElementById('gen');
      const materials = (await rpc('list_materials')).filter((m) => m.content);
      if (!materials.length) {
        box.replaceChildren(el('p', {}, t('gen_no_materials'), ' ', el('a', { href: 'library.html' }, t('library'))));
        return;
      }
      const material = el('select', {}, el('option', { value: '' }, t('gen_pick')),
        materials.map((m) => el('option', { value: m.id }, m.title + (m.topic ? ' · ' + m.topic : ''))));
      // Если к экзамену привязан один материал — сразу выбираем его.
      const linked = materials.filter((m) => (exam.materialIds || []).includes(m.id));
      if (linked.length === 1) material.value = linked[0].id;
      const count = el('input', { type: 'number', min: 1, max: 20, value: 5, style: 'width:80px' });
      const lang = el('select', {}, el('option', { value: 'ru' }, t('gen_lang_ru')), el('option', { value: 'kk' }, t('gen_lang_kk')));
      lang.value = LANG;
      const wishes = el('input', { type: 'text', maxlength: 500, placeholder: t('gen_wishes_placeholder') });
      const model = el('select', {}, el('option', { value: 'free' }, t('ai_model_free')), el('option', { value: 'paid' }, t('ai_model_paid')));
      let saved = 'free';
      try { saved = localStorage.getItem('aiQuality') || 'free'; } catch {}
      if (saved === 'paid') model.value = 'paid';
      const msg = el('span', { class: 'muted' });
      const btn = el('button', { type: 'button' }, t('gen_btn'));
      btn.addEventListener('click', async () => {
        msg.className = 'muted'; msg.textContent = '';
        if (!material.value) { msg.className = 'error'; msg.textContent = t('err_gen_no_material'); return; }
        btn.disabled = true; msg.textContent = t('gen_running');
        try {
          const res = await callFunction('grade', {
            action: 'generate', materialId: Number(material.value), count: Number(count.value) || 5,
            examType: exam.type, lang: lang.value, wishes: wishes.value,
            quality: model.value === 'paid' ? 'paid' : (saved.startsWith('free:') ? saved : 'free'),
          });
          // Пустые вопросы-заготовки убираем, новые добавляем в конец.
          exam.questions = exam.questions.filter((q) => q.text.trim());
          exam.questions.push(...res.questions);
          render();
          msg.className = 'ok'; msg.textContent = t('gen_done').replace('{n}', res.questions.length);
        } catch (err) {
          msg.className = 'error'; msg.textContent = err.message;
        } finally { btn.disabled = false; }
      });
      box.replaceChildren(
        el('label', {}, t('gen_material')), material,
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('label', { class: 'row', style: 'margin:0' }, t('gen_count'), count),
          el('label', { class: 'row', style: 'margin:0' }, t('gen_lang'), lang),
          el('label', { class: 'row', style: 'margin:0' }, t('ai_model'), model)),
        el('label', {}, t('gen_wishes')), wishes,
        el('div', { class: 'row', style: 'margin-top:12px' }, btn, msg));
    }

    requireLogin().then(async () => {
      exam = await rpc('get_exam', { p_exam_id: id });
      if (exam.status !== 'draft') { location.href = 'monitor.html?id=' + id; return; }
      document.getElementById('title').value = exam.title;
      document.getElementById('type').textContent = t(exam.type === 'quiz' ? 'type_quiz' : 'type_text');
      if (!exam.questions.length) exam.questions.push(blankQuestion());
      render();
      renderExamMeta(document.getElementById('meta'), exam).catch(showPageError);
      renderGenerator().catch(showPageError);
    }).catch(showPageError);
  </script>
</body>
</html>
