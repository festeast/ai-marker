<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_edit">Редактор — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script><script src="code-runner.js"></script><script src="science.js"></script>
</head>
<body>
  <main class="wrap">
    <p><a href="teacher.html" data-i18n="back"></a></p>
    <div class="card">
      <label for="title" data-i18n="exam_title"></label>
      <input type="text" id="title">
      <p class="muted" id="type"></p>
      <label class="check"><input type="checkbox" id="shuffle"> <span data-i18n="shuffle_label"></span></label>
      <p class="muted small" data-i18n="shuffle_hint"></p>
      <label class="check"><input type="checkbox" id="strict"> <span data-i18n="strict_label"></span></label>
      <p class="muted small" data-i18n="strict_hint"></p>
      <div id="strict-opts" hidden>
        <label for="max-leaves" data-i18n="strict_max_leaves"></label>
        <input type="number" id="max-leaves" min="1" max="100" style="max-width:120px">
        <p class="muted small" data-i18n="strict_max_leaves_hint"></p>
      </div>
      <label class="check"><input type="checkbox" id="pick"> <span data-i18n="pick_label"></span></label>
      <p class="muted small" data-i18n="pick_hint"></p>
      <div id="pick-opts" hidden>
        <label for="pick-count" data-i18n="pick_count"></label>
        <input type="number" id="pick-count" min="1" max="500" style="max-width:120px">
        <p class="small" id="pick-note"></p>
      </div>
      <div id="meta"></div>
    </div>
    <div class="card" id="tools"></div>
    <details class="card" id="bank-box">
      <summary><b data-i18n="bank_title"></b> <span class="muted" id="bank-summary"></span></summary>
      <p class="muted" data-i18n="bank_intro"></p>
      <div id="bank"></div>
    </details>
    <details class="card" id="gen-box">
      <summary><b data-i18n="gen_title"></b></summary>
      <p class="muted" data-i18n="gen_intro"></p>
      <div id="gen"></div>
    </details>
    <div class="card">
      <h2 data-i18n="questions"></h2>
      <div id="questions"></div>
      <button class="secondary" id="add" data-i18n="add_question"></button>
    </div>
    <div class="row">
      <button class="secondary" id="save" data-i18n="save"></button>
      <button id="publish" data-i18n="confirm_publish"></button>
      <button class="danger" id="delete" data-i18n="delete_exam"></button>
      <span id="msg"></span>
    </div>
    <div class="error" id="err"></div>
  </main>
  <script>
    const id = Number(new URLSearchParams(location.search).get('id'));
    let exam;

    // Какие типы вопросов можно добавить в экзамен такого типа.
    function allowedKinds() {
      // «Формула / реакция» и «Заполни таблицу» — в любом экзамене.
      if (exam.type === 'text') return ['text', 'code', 'formula', 'table'];
      if (exam.type === 'quiz') return ['choice', 'truefalse', 'order', 'formula', 'table'];
      return ['choice', 'truefalse', 'order', 'text', 'code', 'formula', 'table'];
    }

    function blankQuestion(kind) {
      kind = kind || (exam.type === 'text' ? 'text' : 'choice');
      const q = { kind, text: '', points: 1 };
      if (kind === 'choice') Object.assign(q, { options: ['', ''], correctIndex: 0 });
      if (kind === 'truefalse') Object.assign(q, { options: [t('tf_true'), t('tf_false')], correctIndex: 0 });
      if (kind === 'order') Object.assign(q, { options: ['', '', ''] });
      if (kind === 'code') Object.assign(q, { lang: 'python', starter: CodeRunner.starter('python'), tests: [{ input: '', output: '' }] });
      if (kind === 'formula') q.spec = { mode: 'blanks', template: '', chem: true, cs: true };
      if (kind === 'table') {
        const cell = (b) => (b ? { v: '', b: true } : { v: '' });
        q.spec = { header: true, chem: false, cs: false, rows: [[cell(), cell()], [cell(), cell(true)], [cell(), cell(true)]] };
      }
      return q;
    }

    // Смена типа: текст и баллы сохраняются, остальное — с чистого листа (варианты по возможности тоже).
    function changeKind(q, kind) {
      const fresh = blankQuestion(kind);
      const keep = (q.options || []).filter((o) => o.trim());
      if ((kind === 'choice' || kind === 'order') && q.kind !== 'truefalse' && keep.length >= 2) fresh.options = keep;
      Object.keys(q).forEach((k) => { if (!['text', 'points', 'id'].includes(k)) delete q[k]; });
      Object.assign(q, fresh, { text: q.text, points: q.points || 1 });
    }

    function moveBtn(label, title, onclick, disabled) {
      const b = el('button', { type: 'button', class: 'secondary small', title, onclick }, label);
      b.disabled = disabled;
      return b;
    }

    function renderChoice(q, i, parts) {
      q.options.forEach((opt, j) => {
        const input = el('input', { type: 'text', placeholder: `${t('option')} ${j + 1}` });
        input.value = opt;
        input.addEventListener('input', () => { q.options[j] = input.value; });
        const radio = el('input', { type: 'radio', name: 'correct-' + i, title: t('correct') });
        radio.checked = q.correctIndex === j;
        radio.addEventListener('change', () => { q.correctIndex = j; });
        parts.push(el('div', { class: 'option' }, radio, input,
          q.options.length > 2 ? el('button', { class: 'secondary small', onclick: () => {
            q.options.splice(j, 1);
            if (q.correctIndex >= q.options.length) q.correctIndex = 0;
            render();
          } }, '×') : null));
      });
      parts.push(el('p', { class: 'muted' }, '○ = ' + t('correct')));
      parts.push(el('button', { class: 'secondary small', onclick: () => { q.options.push(''); render(); } }, t('add_option')));
    }

    function renderTrueFalse(q, i, parts) {
      [0, 1].forEach((j) => {
        const radio = el('input', { type: 'radio', name: 'correct-' + i, title: t('correct') });
        radio.checked = q.correctIndex === j;
        radio.addEventListener('change', () => { q.correctIndex = j; });
        parts.push(el('label', { class: 'choice' }, radio, ' ', q.options[j]));
      });
      parts.push(el('p', { class: 'muted' }, '○ = ' + t('correct')));
    }

    function renderOrder(q, parts) {
      parts.push(el('p', { class: 'muted' }, t('order_hint')));
      const list = el('div', { class: 'order-list' });
      q.options.forEach((opt, j) => {
        const input = el('input', { type: 'text', placeholder: `${t('order_item')} ${j + 1}` });
        input.value = opt;
        input.addEventListener('input', () => { q.options[j] = input.value; });
        const swap = (a, b) => { [q.options[a], q.options[b]] = [q.options[b], q.options[a]]; render(); };
        list.append(el('div', { class: 'order-item' }, el('span', { class: 'num' }, `${j + 1}.`), input,
          moveBtn('↑', t('move_up'), () => swap(j, j - 1), j === 0),
          moveBtn('↓', t('move_down'), () => swap(j, j + 1), j === q.options.length - 1),
          q.options.length > 2 ? el('button', { type: 'button', class: 'secondary small', onclick: () => { q.options.splice(j, 1); render(); } }, '×') : null));
      });
      parts.push(list, el('div', { class: 'row' },
        el('button', { type: 'button', class: 'secondary small', onclick: () => { q.options.push(''); render(); } }, t('add_option')),
        el('button', { type: 'button', class: 'secondary small', onclick: () => { q.options.reverse(); render(); } }, t('order_reverse'))));
    }

    // Вопрос с кодом: язык, заготовка, эталонное решение и тесты (ввод → ожидаемый вывод).
    const codeNotes = new WeakMap(); // сообщение под тестами переживает перерисовку
    function renderCode(q, parts) {
      if (!q.tests) q.tests = [];
      const lang = el('select', { style: 'width:auto;margin:0' }, CodeRunner.LANGS.map((l) => el('option', { value: l }, CodeRunner.langName(l))));
      lang.value = q.lang || 'python';
      lang.addEventListener('change', () => {
        const old = q.lang;
        q.lang = lang.value;
        if (!(q.starter || '').trim() || q.starter === CodeRunner.starter(old)) q.starter = CodeRunner.starter(q.lang);
        render();
      });
      const starter = CodeRunner.editor(el('textarea', { rows: 6 }));
      starter.value = q.starter || '';
      starter.addEventListener('input', () => { q.starter = starter.value; });
      const ref = CodeRunner.editor(el('textarea', { rows: 6, placeholder: t('code_reference_placeholder') }));
      ref.value = q.reference || '';
      ref.addEventListener('input', () => { q.reference = ref.value; });

      const tests = q.tests.map((tc, j) => {
        const input = el('textarea', { class: 'code-small', rows: 2, spellcheck: 'false' });
        input.value = tc.input || '';
        input.addEventListener('input', () => { tc.input = input.value; });
        const output = el('textarea', { class: 'code-small', rows: 2, spellcheck: 'false' });
        output.value = tc.output || '';
        output.addEventListener('input', () => { tc.output = output.value; });
        return el('div', { class: 'test-row' }, el('span', { class: 'num' }, `${j + 1}.`),
          el('div', {}, el('label', {}, t('code_test_input')), input),
          el('div', {}, el('label', {}, t('code_test_output')), output),
          el('button', { type: 'button', class: 'secondary small', style: 'margin-top:24px', title: t('remove'), onclick: () => { q.tests.splice(j, 1); render(); } }, '×'));
      });

      const note = codeNotes.get(q);
      const msg = el('span', { class: note ? note.cls : 'muted' }, note ? note.text : '');
      const setMsg = (cls, text) => { codeNotes.set(q, { cls, text }); msg.className = cls; msg.textContent = text; };
      const fill = el('button', { type: 'button', class: 'secondary small' }, t('code_fill_outputs'));
      fill.addEventListener('click', async () => {
        if (!(q.reference || '').trim()) { setMsg('error', t('code_no_reference')); return; }
        if (!q.tests.length) q.tests.push({ input: '', output: '' });
        fill.disabled = true;
        try {
          const res = await CodeRunner.run(q.lang, q.reference, q.tests.map((x) => x.input || ''), (k) => setMsg('muted', t(k)));
          if (res.compileError) { setMsg('error', t('code_compile_error') + ': ' + res.compileError.slice(0, 500)); return; }
          const bad = [];
          res.results.forEach((r, i) => {
            q.tests[i].output = r.output.replace(/\s+$/, '');
            if (r.error || r.timeout) bad.push(r.timeout ? t('code_test_timeout').replace('{i}', i + 1) : t('code_test_error').replace('{i}', i + 1).replace('{error}', r.error.trim().split('\n').pop()));
          });
          codeNotes.set(q, bad.length ? { cls: 'error', text: bad.join(' ') } : { cls: 'ok', text: t('code_fill_done') });
          render();
        } catch (err) {
          setMsg('error', err.message);
        } finally { fill.disabled = false; }
      });

      parts.push(
        el('label', { class: 'row' }, t('code_lang'), lang),
        el('label', {}, t('code_starter')), starter,
        el('label', {}, t('code_reference')), ref,
        el('label', { style: 'margin-top:16px' }, el('b', {}, t('code_tests'))),
        el('p', { class: 'muted', style: 'margin:0' }, t('code_tests_hint')),
        ...tests,
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', { type: 'button', class: 'secondary small', onclick: () => { q.tests.push({ input: '', output: '' }); render(); } }, t('code_add_test')),
          fill, msg));
    }

    const check = (label, on, onchange) => {
      const box = el('input', { type: 'checkbox' });
      box.checked = !!on;
      box.addEventListener('change', () => onchange(box.checked));
      return el('label', { class: 'check' }, box, ' ', el('span', {}, label));
    };

    // Формула или реакция: пропуски в [скобках] или ответ целиком (несколько верных вариантов).
    function renderFormula(q, parts) {
      const s = q.spec || (q.spec = { mode: 'blanks', template: '', chem: true, cs: true });
      const kit = Sci.kit({ chem: s.chem });
      const mode = el('select', { style: 'width:auto;margin:0' }, ['blanks', 'full'].map((m) => el('option', { value: m }, t('formula_mode_' + m))));
      mode.value = s.mode === 'full' ? 'full' : 'blanks';
      mode.addEventListener('change', () => {
        // Переносим уже написанное: шаблон без скобок становится ответом и наоборот.
        if (mode.value === 'full') {
          s.answers = (s.answers || []).filter((a) => a.trim()).length ? s.answers : [Sci.correctText({ kind: 'formula', spec: s })];
        } else if (!(s.template || '').trim()) s.template = (s.answers || [])[0] || '';
        s.mode = mode.value;
        render();
      });
      parts.push(el('label', { class: 'row' }, t('formula_mode'), mode),
        check(t('sci_chem'), s.chem, (v) => { s.chem = v; kit.setChem(v); }),
        check(t('sci_cs'), s.cs !== false, (v) => { s.cs = v; }));
      if (s.mode === 'full') {
        if (!s.answers || !s.answers.length) s.answers = [''];
        const rows = s.answers.map((a, j) => {
          const input = kit.bind(el('input', { type: 'text', class: 'sci-input', placeholder: t('sci_full_placeholder') }), (v) => { s.answers[j] = v; });
          input.value = a;
          return el('div', { class: 'option' }, input,
            s.answers.length > 1 ? el('button', { type: 'button', class: 'secondary small', title: t('remove'), onclick: () => { s.answers.splice(j, 1); render(); } }, '×') : null);
        });
        parts.push(el('label', {}, t('formula_answers')), kit.node, ...rows,
          el('p', { class: 'muted small' }, t('formula_answers_hint')),
          el('button', { type: 'button', class: 'secondary small', onclick: () => { s.answers.push(''); render(); } }, t('formula_add_answer')));
        return;
      }
      const preview = el('div', { class: 'sci-formula sci-preview' });
      const drawPreview = () => {
        const { parts: bits } = Sci.splitTemplate(s.template);
        preview.replaceChildren(...bits.flatMap((b, k) => (k < bits.length - 1 ? [el('span', {}, b), el('span', { class: 'sci-box' })] : [el('span', {}, b)])));
      };
      const tpl = kit.bind(el('input', { type: 'text', class: 'sci-input', placeholder: t('formula_template_placeholder') }), (v) => { s.template = v; drawPreview(); });
      tpl.value = s.template || '';
      drawPreview();
      parts.push(el('label', {}, t('formula_template')), kit.node, tpl,
        el('p', { class: 'muted small' }, t('formula_template_hint')),
        el('div', { class: 'muted small' }, t('formula_preview')), preview);
    }

    // «Заполни таблицу»: сетка ячеек; отмеченные заполняет ученик, в них — верный ответ.
    function renderTable(q, parts) {
      const s = q.spec;
      const kit = Sci.kit({ chem: s.chem });
      const cols = s.rows[0].length;
      const body = s.rows.map((row, r) => el('tr', {}, row.map((c) => {
        const input = kit.bind(el('input', { type: 'text', class: 'sci-cell', placeholder: c.b ? t('table_cell_answer') : '' }), (v) => { c.v = v; });
        input.value = c.v || '';
        const box = el('input', { type: 'checkbox', title: t('table_cell_blank') });
        box.checked = !!c.b;
        const td = el('td', { class: c.b ? 'sci-fill' : '' }, input, el('label', { class: 'sci-cell-check' }, box, ' ', t('table_cell_blank')));
        box.addEventListener('change', () => {
          c.b = box.checked;
          if (!c.b) delete c.b;
          td.className = box.checked ? 'sci-fill' : '';
          input.placeholder = box.checked ? t('table_cell_answer') : '';
        });
        return td;
      }), el('td', { class: 'sci-tools' }, s.rows.length > 1
        ? el('button', { type: 'button', class: 'secondary small', title: t('table_remove_row'), onclick: () => { s.rows.splice(r, 1); render(); } }, '×') : null)));
      const removeCols = cols > 1 ? el('tr', {}, s.rows[0].map((_, k) => el('td', { class: 'sci-tools' },
        el('button', { type: 'button', class: 'secondary small', title: t('table_remove_col'), onclick: () => { s.rows.forEach((row) => row.splice(k, 1)); render(); } }, '×'))), el('td')) : null;
      parts.push(
        check(t('table_header'), s.header, (v) => { s.header = v; }),
        check(t('sci_chem'), s.chem, (v) => { s.chem = v; kit.setChem(v); }),
        check(t('sci_cs'), s.cs, (v) => { s.cs = v; }),
        el('p', { class: 'muted small' }, t('table_hint')), kit.node,
        el('div', { class: 'table-scroll' }, el('table', { class: 'sci-table sci-edit' }, el('tbody', {}, body, removeCols))),
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', { type: 'button', class: 'secondary small', onclick: () => { if (s.rows.length < 30) s.rows.push(s.rows[0].map(() => ({ v: '' }))); render(); } }, t('table_add_row')),
          el('button', { type: 'button', class: 'secondary small', onclick: () => { if (cols < 10) s.rows.forEach((row) => row.push({ v: '' })); render(); } }, t('table_add_col'))));
    }

    // Критерии оценки (рубрика) открытого вопроса или кода: баллы вопроса — их сумма.
    function renderRubric(q, parts, points) {
      if (!q.rubric) q.rubric = [];
      const rows = q.rubric.map((c, j) => {
        const text = el('input', { type: 'text', maxlength: 500, placeholder: t('rubric_text_placeholder') });
        text.value = c.text || '';
        text.addEventListener('input', () => { c.text = text.value; });
        const pts = el('input', { type: 'number', min: 1, max: 100, step: 1 });
        pts.value = c.points || 1;
        pts.addEventListener('input', () => { c.points = Number(pts.value); syncPoints(); });
        return el('div', { class: 'rubric-row' }, text, pts,
          el('button', { type: 'button', class: 'secondary small', title: t('remove'), onclick: () => { q.rubric.splice(j, 1); render(); } }, '×'));
      });
      const sum = el('span', { class: 'muted' });
      function syncPoints() {
        if (!q.rubric.length) { points.disabled = false; sum.textContent = ''; return; }
        q.points = q.rubric.reduce((s, c) => s + (Number(c.points) || 0), 0);
        points.value = q.points;
        points.disabled = true;
        sum.textContent = t('rubric_sum').replace('{n}', q.points);
      }
      syncPoints();
      parts.push(el('label', { style: 'margin-top:12px' }, el('b', {}, t('rubric_title'))),
        el('p', { class: 'muted', style: 'margin:0' }, t('rubric_hint')), ...rows,
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', { type: 'button', class: 'secondary small', onclick: () => { q.rubric.push({ text: '', points: 1 }); render(); } }, t('rubric_add')), sum));
    }

    function render() {
      const box = document.getElementById('questions');
      const kinds = allowedKinds();
      box.replaceChildren(...exam.questions.map((q, i) => {
        if (!q.kind) q.kind = kinds[0];
        const text = el('textarea', { rows: 2, style: 'min-height:60px' });
        text.value = q.text;
        text.addEventListener('input', () => { q.text = text.value; });
        let kindSelect = null;
        if (kinds.length > 1) {
          kindSelect = el('select', { title: t('kind_label'), style: 'width:auto;margin:0' },
            kinds.map((k) => el('option', { value: k }, t('kind_' + k))));
          kindSelect.value = q.kind;
          kindSelect.addEventListener('change', () => { changeKind(q, kindSelect.value); render(); });
        }
        const parts = [
          el('div', { class: 'row spread' },
            el('span', { class: 'row', style: 'margin:0' }, el('b', {}, `${t('question')} ${i + 1}`), kindSelect),
            el('span', { class: 'row', style: 'margin:0' },
              el('button', { type: 'button', class: 'secondary small', title: t('bank_save_one_hint'), onclick: (e) => saveToBank([q], e.target) }, t('bank_save_one')),
              el('button', { class: 'danger small', onclick: () => { exam.questions.splice(i, 1); render(); } }, t('remove')))),
          text,
        ];
        if (q.kind === 'choice') renderChoice(q, i, parts);
        else if (q.kind === 'truefalse') renderTrueFalse(q, i, parts);
        else if (q.kind === 'order') renderOrder(q, parts);
        else if (q.kind === 'code') renderCode(q, parts);
        else if (q.kind === 'formula') renderFormula(q, parts);
        else if (q.kind === 'table') renderTable(q, parts);
        else {
          const ref = el('textarea', { rows: 2, style: 'min-height:60px', placeholder: t('reference_placeholder') });
          ref.value = q.reference || '';
          ref.addEventListener('input', () => { q.reference = ref.value; });
          parts.push(el('label', {}, t('reference')), ref);
        }
        const points = el('input', { type: 'number', min: 1, max: 100, step: 1, style: 'width:80px' });
        points.value = q.points || 1;
        points.addEventListener('input', () => { q.points = Number(points.value); });
        if (q.kind === 'text' || q.kind === 'code') renderRubric(q, parts, points);
        parts.push(el('label', { class: 'row' }, t('points'), points));
        if (q.kind === 'formula' || q.kind === 'table') parts.push(el('p', { class: 'muted small', style: 'margin:0' }, t('sci_points_hint')));
        return el('div', { class: 'question' }, parts);
      }));
    }

    async function save() {
      document.getElementById('err').textContent = '';
      exam.title = document.getElementById('title').value;
      // Пустые строки тестов не сохраняем.
      exam.questions.forEach((q) => {
        if (q.kind === 'code' && q.tests) q.tests = q.tests.filter((x) => (x.input || '').trim() || (x.output || '').trim());
        if (q.rubric) q.rubric = q.rubric.filter((c) => (c.text || '').trim());
      });
      const saved = await rpc('save_exam', { p_exam_id: id, p_title: exam.title, p_questions: exam.questions });
      exam.questions = saved.questions;
      render();
      updatePickNote();
    }

    function withErrors(fn) {
      return async () => {
        try { await fn(); } catch (err) { document.getElementById('err').textContent = err.message; }
      };
    }

    document.getElementById('add').addEventListener('click', () => {
      const last = exam.questions[exam.questions.length - 1];
      exam.questions.push(blankQuestion(last && last.kind));
      render();
    });
    document.getElementById('save').addEventListener('click', withErrors(async () => {
      await save();
      const msg = document.getElementById('msg');
      msg.textContent = t('saved'); msg.className = 'ok';
      setTimeout(() => { msg.textContent = ''; }, 2000);
    }));
    document.getElementById('publish').addEventListener('click', withErrors(async () => {
      await save();
      if (!exam.questions.length) throw new Error(t('err_no_questions'));
      if (!confirm(t('confirm_publish_q'))) return;
      await rpc('publish_exam', { p_exam_id: id });
      location.href = 'monitor.html?id=' + id;
    }));
    document.getElementById('delete').addEventListener('click', withErrors(async () => {
      if (!confirm(t('delete_exam_q'))) return;
      await rpc('delete_exam', { p_exam_id: id });
      location.href = 'teacher.html';
    }));

    // ИИ составляет вопросы по материалу из библиотеки; они добавляются в список, учитель их проверяет и сохраняет.
    async function renderGenerator() {
      const box = document.getElementById('gen');
      const materials = (await rpc('list_materials')).filter((m) => m.content);
      if (!materials.length) {
        box.replaceChildren(el('p', {}, t('gen_no_materials'), ' ', el('a', { href: 'library.html' }, t('library'))));
        return;
      }
      const material = el('select', {}, el('option', { value: '' }, t('gen_pick')),
        materials.map((m) => el('option', { value: m.id }, m.title + (m.topic ? ' · ' + m.topic : ''))));
      // Если к экзамену привязан один материал — сразу выбираем его.
      const linked = materials.filter((m) => (exam.materialIds || []).includes(m.id));
      if (linked.length === 1) material.value = linked[0].id;
      const count = el('input', { type: 'number', min: 1, max: 20, value: 5, style: 'width:80px' });
      const lang = el('select', {}, ['ru', 'kk', 'en', 'tr'].map((code) => el('option', { value: code }, t('gen_lang_' + code))));
      lang.value = LANG;
      const wishes = el('input', { type: 'text', maxlength: 500, placeholder: t('gen_wishes_placeholder') });
      const model = el('select', {}, el('option', { value: 'free' }, t('ai_model_free')), el('option', { value: 'paid' }, t('ai_model_paid')),
        el('option', { value: 'paid:gpt' }, t('ai_model_paid_gpt')));
      let saved = 'free';
      try { saved = localStorage.getItem('aiQuality') || 'free'; } catch {}
      if (saved === 'paid' || saved === 'paid:gpt') model.value = saved;
      const genKind = el('select', {}, el('option', { value: 'quiz' }, t('type_quiz')), el('option', { value: 'text' }, t('type_text')));
      const msg = el('span', { class: 'muted' });
      const btn = el('button', { type: 'button' }, t('gen_btn'));
      btn.addEventListener('click', async () => {
        msg.className = 'muted'; msg.textContent = '';
        if (!material.value) { msg.className = 'error'; msg.textContent = t('err_gen_no_material'); return; }
        btn.disabled = true; msg.textContent = t('gen_running');
        try {
          const res = await callFunction('grade', {
            action: 'generate', materialId: Number(material.value), count: Number(count.value) || 5,
            examType: exam.type === 'mixed' ? genKind.value : exam.type, lang: lang.value, wishes: wishes.value,
            quality: model.value !== 'free' ? model.value : (saved.startsWith('free:') ? saved : 'free'),
          });
          // Пустые вопросы-заготовки убираем, новые добавляем в конец.
          exam.questions = exam.questions.filter((q) => q.text.trim());
          const genType = exam.type === 'mixed' ? genKind.value : exam.type;
          exam.questions.push(...res.questions.map((q) => ({ kind: genType === 'text' ? 'text' : 'choice', ...q })));
          render();
          msg.className = 'ok'; msg.textContent = t('gen_done').replace('{n}', res.questions.length);
        } catch (err) {
          msg.className = 'error'; msg.textContent = err.message;
        } finally { btn.disabled = false; }
      });
      box.replaceChildren(
        el('label', {}, t('gen_material')), material,
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('label', { class: 'row', style: 'margin:0' }, t('gen_count'), count),
          el('label', { class: 'row', style: 'margin:0' }, t('gen_lang'), lang),
          el('label', { class: 'row', style: 'margin:0' }, t('ai_model'), model),
          exam.type === 'mixed' ? el('label', { class: 'row', style: 'margin:0' }, t('gen_kind'), genKind) : null),
        el('label', {}, t('gen_wishes')), wishes,
        el('div', { class: 'row', style: 'margin-top:12px' }, btn, msg));
    }

    // ---------- Банк вопросов ----------
    let bank = [];
    const bankState = { topic: '', search: '' };
    // Вопрос для save_exam / add_to_bank: без служебных полей.
    const plainQuestion = (q) => {
      const { id: _id, topic: _topic, createdAt: _c, ...rest } = q;
      return JSON.parse(JSON.stringify(rest));
    };
    const bankTopics = () => [...new Set(bank.map((b) => b.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b));

    async function saveToBank(questions, button) {
      questions = questions.filter((q) => (q.text || '').trim());
      if (!questions.length) { alert(t('bank_nothing')); return; }
      const topics = bankTopics();
      const topic = prompt(t('bank_topic_prompt') + (topics.length ? `\n(${topics.slice(0, 10).join(', ')})` : ''), bankState.topic || exam.className || '');
      if (topic === null) return;
      if (button) button.disabled = true;
      try {
        const clean = questions.map((q) => {
          const x = plainQuestion(q);
          if (x.tests) x.tests = x.tests.filter((c) => (c.input || '').trim() || (c.output || '').trim());
          if (x.rubric) x.rubric = x.rubric.filter((c) => (c.text || '').trim());
          return x;
        });
        const n = await rpc('add_to_bank', { p_topic: topic, p_questions: clean });
        bankState.topic = topic.trim();
        await loadBank();
        if (button) { const old = button.textContent; button.textContent = '✓'; setTimeout(() => { button.textContent = old; }, 1500); }
        document.getElementById('msg').className = 'ok';
        document.getElementById('msg').textContent = t('bank_saved').replace('{n}', n);
      } catch (err) {
        document.getElementById('err').textContent = err.message;
      } finally { if (button) button.disabled = false; }
    }

    function addFromBank(items) {
      const have = new Set(exam.questions.map((q) => q.text.trim()));
      const fresh = items.filter((b) => !have.has(b.text.trim()));
      exam.questions = exam.questions.filter((q) => q.text.trim());
      exam.questions.push(...fresh.map(plainQuestion));
      render();
      return fresh.length;
    }

    async function loadBank() {
      bank = await rpc('list_bank');
      renderBank();
    }

    function renderBank() {
      const box = document.getElementById('bank');
      document.getElementById('bank-summary').textContent = bank.length ? `(${bank.length})` : '';
      const kinds = allowedKinds();
      const saveAll = el('button', { type: 'button', class: 'secondary', onclick: (e) => saveToBank(exam.questions, e.target) }, t('bank_save_all'));
      if (!bank.length) {
        box.replaceChildren(el('p', { class: 'muted' }, t('bank_empty')), saveAll);
        return;
      }
      const topics = bankTopics();
      const topic = el('select', { style: 'width:auto' }, el('option', { value: '' }, t('bank_all_topics')),
        topics.map((x) => el('option', { value: x }, `${x} (${bank.filter((b) => b.topic === x).length})`)),
        bank.some((b) => !b.topic) ? el('option', { value: '__none__' }, t('bank_no_topic')) : null);
      topic.value = bankState.topic && (topics.includes(bankState.topic) || bankState.topic === '__none__') ? bankState.topic : '';
      const search = el('input', { type: 'text', placeholder: t('bank_search'), style: 'max-width:260px' });
      search.value = bankState.search;
      const filtered = () => bank.filter((b) => (!topic.value || (topic.value === '__none__' ? !b.topic : b.topic === topic.value))
        && (!search.value.trim() || b.text.toLowerCase().includes(search.value.trim().toLowerCase())));
      const list = el('div', { class: 'bank-list' });
      const checks = new Map();
      const count = el('input', { type: 'number', min: 1, max: 200, value: 5, style: 'width:80px' });
      const msg = el('span', { class: 'muted' });
      const drawList = () => {
        checks.clear();
        const inExam = new Set(exam.questions.map((q) => q.text.trim()));
        const items = filtered();
        list.replaceChildren(...(items.length ? items.map((b) => {
          const ok = kinds.includes(b.kind);
          const cb = el('input', { type: 'checkbox' });
          cb.disabled = !ok;
          if (ok) checks.set(b.id, cb);
          return el('div', { class: 'bank-item' + (ok ? '' : ' disabled') },
            el('label', {}, cb, el('span', {}, b.text,
              el('span', { class: 'kind-tag' }, t('kind_' + b.kind)),
              el('span', { class: 'muted' }, ` · ${b.points} ${t('bank_points_short')}`),
              b.topic ? el('span', { class: 'muted' }, ` · ${b.topic}`) : null,
              inExam.has(b.text.trim()) ? el('span', { class: 'ok small' }, ' · ' + t('bank_in_exam')) : null,
              ok ? null : el('span', { class: 'muted small' }, ' · ' + t('bank_wrong_kind')))),
            el('button', { type: 'button', class: 'secondary small', title: t('bank_delete'), onclick: async () => {
              if (!confirm(t('bank_delete_q'))) return;
              try { await rpc('delete_bank_question', { p_id: b.id }); await loadBank(); } catch (err) { msg.className = 'error'; msg.textContent = err.message; }
            } }, '×'));
        }) : [el('p', { class: 'muted', style: 'padding:8px 10px;margin:0' }, t('bank_not_found'))]));
      };
      topic.addEventListener('change', () => { bankState.topic = topic.value; drawList(); });
      search.addEventListener('input', () => { bankState.search = search.value; drawList(); });
      drawList();
      const addChecked = el('button', { type: 'button', onclick: () => {
        const picked = bank.filter((b) => checks.get(b.id) && checks.get(b.id).checked);
        if (!picked.length) { msg.className = 'error'; msg.textContent = t('bank_pick_first'); return; }
        const n = addFromBank(picked);
        msg.className = 'ok'; msg.textContent = t('bank_added').replace('{n}', n);
        drawList();
      } }, t('bank_add_checked'));
      const addRandom = el('button', { type: 'button', class: 'secondary', onclick: () => {
        const inExam = new Set(exam.questions.map((q) => q.text.trim()));
        const pool = filtered().filter((b) => kinds.includes(b.kind) && !inExam.has(b.text.trim()));
        if (!pool.length) { msg.className = 'error'; msg.textContent = t('bank_pool_empty'); return; }
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        const n = addFromBank(pool.slice(0, Math.max(1, Number(count.value) || 1)));
        msg.className = 'ok'; msg.textContent = t('bank_added').replace('{n}', n);
        drawList();
      } }, t('bank_add_random'));
      box.replaceChildren(
        el('div', { class: 'row' }, topic, search),
        list,
        el('div', { class: 'row', style: 'margin-top:8px' }, addChecked,
          el('span', { class: 'row', style: 'margin:0' }, addRandom, count), msg),
        el('div', { class: 'row', style: 'margin-top:16px' }, saveAll));
    }

    // Варианты: сколько случайных вопросов достанется каждому ученику.
    function updatePickNote() {
      const note = document.getElementById('pick-note');
      if (!exam.pickCount) { note.textContent = ''; return; }
      const n = exam.questions.filter((q) => (q.text || '').trim()).length;
      const pts = new Set(exam.questions.map((q) => q.points || 1));
      const parts = [];
      if (exam.pickCount >= n) parts.push(t('pick_all').replace('{n}', n));
      else parts.push(t('pick_of').replace('{k}', exam.pickCount).replace('{n}', n));
      if (pts.size > 1) parts.push(t('pick_points_warn'));
      note.className = 'small ' + (exam.pickCount >= n || pts.size > 1 ? 'warn' : 'muted');
      note.textContent = parts.join(' ');
    }

    requireLogin().then(async () => {
      exam = await rpc('get_exam', { p_exam_id: id });
      if (exam.status !== 'draft') { location.href = 'monitor.html?id=' + id; return; }
      document.getElementById('title').value = exam.title;
      document.getElementById('type').textContent = t('type_' + exam.type);
      const shuffle = document.getElementById('shuffle');
      shuffle.checked = !!exam.shuffle;
      shuffle.addEventListener('change', withErrors(async () => {
        await rpc('set_exam_shuffle', { p_exam_id: id, p_shuffle: shuffle.checked });
        exam.shuffle = shuffle.checked;
      }));
      const strict = document.getElementById('strict'), maxLeaves = document.getElementById('max-leaves');
      strict.checked = !!exam.strictMode;
      maxLeaves.value = exam.maxLeaves || '';
      document.getElementById('strict-opts').hidden = !strict.checked;
      const saveStrict = withErrors(async () => {
        const n = Math.round(Number(maxLeaves.value));
        const max = maxLeaves.value.trim() && n >= 1 ? Math.min(n, 100) : null;
        maxLeaves.value = max || '';
        const res = await rpc('set_exam_strict', { p_exam_id: id, p_strict: strict.checked, p_max_leaves: max });
        exam.strictMode = res.strictMode; exam.maxLeaves = res.maxLeaves;
        document.getElementById('strict-opts').hidden = !strict.checked;
      });
      strict.addEventListener('change', saveStrict);
      maxLeaves.addEventListener('change', saveStrict);
      const pick = document.getElementById('pick'), pickCount = document.getElementById('pick-count');
      pick.checked = !!exam.pickCount;
      pickCount.value = exam.pickCount || '';
      document.getElementById('pick-opts').hidden = !pick.checked;
      const savePick = withErrors(async () => {
        let n = null;
        if (pick.checked) {
          n = Math.min(Math.max(Math.round(Number(pickCount.value)) || 0, 0), 500);
          if (!n) n = Math.max(1, Math.min(10, exam.questions.length - 1));
        }
        const res = await rpc('set_exam_pick', { p_exam_id: id, p_count: n });
        exam.pickCount = res.pickCount;
        pickCount.value = exam.pickCount || '';
        document.getElementById('pick-opts').hidden = !pick.checked;
        updatePickNote();
      });
      pick.addEventListener('change', savePick);
      pickCount.addEventListener('change', savePick);
      if (!exam.questions.length) exam.questions.push(blankQuestion());
      render();
      updatePickNote();
      loadBank().catch(showPageError);
      renderExamMeta(document.getElementById('meta'), exam).catch(showPageError);
      renderToolsEditor(document.getElementById('tools'), exam);
      renderGenerator().catch(showPageError);
    }).catch(showPageError);
  </script>
</body>
</html>
