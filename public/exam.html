<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_exam">Экзамен — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
</head>
<body>
  <header><div class="wrap"><span class="brand" data-i18n="app_name"></span><span class="muted" id="who"></span></div></header>
  <main class="wrap" style="max-width:760px">
    <h1 id="title"></h1>
    <div class="card narrow" id="join" hidden>
      <form id="join-form">
        <label for="name" data-i18n="your_name"></label>
        <input type="text" id="name" autocomplete="name" required>
        <p class="muted" data-i18n="monitor_notice"></p>
        <button type="submit" data-i18n="start"></button>
      </form>
    </div>
    <div id="attempt" hidden>
      <div class="conn-bar" id="offline" role="status" hidden></div>
      <div class="notice" data-i18n="monitor_notice"></div>
      <div id="questions"></div>
      <div class="row spread">
        <span class="muted" id="save-state" data-i18n="autosaved"></span>
        <button id="submit" data-i18n="submit"></button>
      </div>
    </div>
    <div class="card" id="done" hidden><p class="ok" data-i18n="submitted_msg"></p></div>
    <div class="error" id="err"></div>
  </main>
  <script>
    const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    const storeKey = 'attempt:' + code;
    let token = null;
    try { token = localStorage.getItem(storeKey); } catch {}
    const answers = {};
    let finished = false;

    const showError = (err) => { document.getElementById('err').textContent = err.message; };

    // ---------- отслеживание: уход со страницы и вставки ----------
    let away = false, awaySince = 0, suppress = false;

    function sendEvent(type, detail) {
      if (finished) return;
      if (eventQueue.length < 200) eventQueue.push({ type, detail });
      flushEvents();
    }
    function markAway(reason) {
      if (away || suppress || finished) return;
      away = true; awaySince = Date.now();
      sendEvent('leave', { reason });
    }
    function markBack() {
      if (!away || document.visibilityState !== 'visible' || !document.hasFocus()) return;
      away = false;
      sendEvent('return', { awayMs: Date.now() - awaySince });
    }
    function startTracking() {
      // Студент закрывал или перезагружал страницу — отмечаем возвращение.
      let closedAt = null;
      try { closedAt = Number(localStorage.getItem(storeKey + ':closedAt')); localStorage.removeItem(storeKey + ':closedAt'); } catch {}
      // Событие при закрытии могло не дойти, поэтому повторяем его (сервер не запишет дубль).
      if (closedAt) {
        rpc('log_event', { p_token: token, p_type: 'leave', p_detail: { reason: 'close' } })
          .finally(() => sendEvent('return', { awayMs: Date.now() - closedAt }));
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') markAway('hidden'); else markBack();
      });
      window.addEventListener('blur', () => markAway('blur'));
      window.addEventListener('focus', markBack);
      window.addEventListener('pagehide', () => {
        if (finished) return;
        try { localStorage.setItem(storeKey + ':closedAt', String(Date.now())); } catch {}
        rpcKeepalive('log_event', { p_token: token, p_type: 'leave', p_detail: { reason: 'close' } });
      });
      document.addEventListener('paste', (e) => {
        const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
        const q = e.target.closest && e.target.closest('[data-qid]');
        sendEvent('paste', { text, questionId: q ? Number(q.dataset.qid) : null });
      });
      document.addEventListener('drop', (e) => {
        const text = (e.dataTransfer && e.dataTransfer.getData('text')) || '';
        if (!text) return;
        const q = e.target.closest && e.target.closest('[data-qid]');
        sendEvent('paste', { text, questionId: q ? Number(q.dataset.qid) : null });
      });
      setInterval(() => {
        if (finished || !online) return;
        rpc('heartbeat', { p_token: token }, 10000).catch((err) => { if (retryable(err)) goOffline(); });
      }, 10000);
    }

    // ---------- связь ----------
    // Ответы сначала сохраняются на этом устройстве, а на сервер уходят, когда есть интернет.
    // Если связь пропала, страница сама повторяет отправку; сдача работы тоже ждёт связи.
    const localKey = storeKey + ':answers', submitKey = storeKey + ':submit';
    const eventQueue = [];
    let saveTimer = null, retryTimer = null, retryDelay = 2000;
    let dirty = false, busy = false, submitting = false, sendingEvents = false, online = true, submitPending = false;
    try { submitPending = localStorage.getItem(submitKey) === '1'; } catch {}
    const retryable = (err) => err.code === 'network' || err.code === 'server_error';

    function setConn(state) {
      const line = document.getElementById('save-state');
      line.textContent = t('conn_' + state);
      line.className = state === 'offline' || state === 'submit_waiting' ? 'warn' : 'muted';
      const bar = document.getElementById('offline');
      bar.hidden = !(state === 'offline' || state === 'submit_waiting');
      bar.textContent = t('conn_' + state);
      document.getElementById('submit').disabled = submitPending;
    }

    function storeLocal() {
      try { localStorage.setItem(localKey, JSON.stringify(answers)); } catch {}
    }

    function goOffline() {
      online = false;
      setConn(submitPending ? 'submit_waiting' : 'offline');
      clearTimeout(retryTimer);
      retryTimer = setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    }
    function backOnline() {
      online = true; retryDelay = 2000;
    }

    function scheduleSave() {
      storeLocal();
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 800);
    }

    // Отправляет то, что ещё не дошло: сдачу работы, ответы, события.
    async function flush() {
      clearTimeout(retryTimer);
      if (finished) return;
      if (submitPending) return trySubmit();
      if (busy) return;
      if (!dirty) { if (!online) await pingServer(); return flushEvents(); }
      busy = true; dirty = false;
      if (online) setConn('saving');
      try {
        await rpc('save_answers', { p_token: token, p_answers: answers }, 15000);
        backOnline();
        setConn(dirty ? 'saving' : 'saved');
      } catch (err) {
        dirty = true;
        if (retryable(err)) goOffline(); else showError(err);
      } finally { busy = false; }
      if (online) { if (dirty) saveTimer = setTimeout(flush, 800); flushEvents(); }
    }

    async function pingServer() {
      try { await rpc('heartbeat', { p_token: token }, 10000); backOnline(); setConn('saved'); } catch { goOffline(); }
    }

    async function flushEvents() {
      if (sendingEvents || !online) return;
      sendingEvents = true;
      try {
        while (eventQueue.length && !finished) {
          const e = eventQueue[0];
          try {
            await rpc('log_event', { p_token: token, p_type: e.type, p_detail: e.detail }, 15000);
          } catch (err) {
            if (retryable(err)) { goOffline(); return; }
          }
          eventQueue.shift();
        }
      } finally { sendingEvents = false; }
    }

    async function trySubmit() {
      if (submitting) return;
      submitPending = true;
      try { localStorage.setItem(submitKey, '1'); } catch {}
      clearTimeout(saveTimer);
      submitting = true;
      setConn('submitting');
      try {
        await rpc('submit_attempt', { p_token: token, p_answers: answers }, 20000);
        finishAttempt();
      } catch (err) {
        if (err.code === 'already_submitted') finishAttempt();
        else if (retryable(err)) goOffline();
        else {
          submitPending = false;
          try { localStorage.removeItem(submitKey); } catch {}
          setConn('saved');
          showError(err);
        }
      } finally { submitting = false; }
    }

    function finishAttempt() {
      try { localStorage.removeItem(localKey); localStorage.removeItem(submitKey); } catch {}
      showDone();
    }

    window.addEventListener('online', () => { if (!online) { retryDelay = 2000; flush(); } });

    // Вопрос «по порядку»: ответ — номера элементов (как у учителя) через запятую в порядке ученика.
    function renderOrder(q, parts) {
      const byI = new Map(q.options.map((o) => [o.i, o]));
      let order = (answers[q.id] || '').split(',').filter((x) => x !== '').map(Number);
      if (order.length !== q.options.length || !order.every((x) => byI.has(x))) order = q.options.map((o) => o.i);
      answers[q.id] = order.join(',');
      const list = el('div', { class: 'order-list' });
      const draw = () => {
        list.replaceChildren(...order.map((x, k) => {
          const swap = (a, b) => { [order[a], order[b]] = [order[b], order[a]]; answers[q.id] = order.join(','); scheduleSave(); draw(); };
          const up = el('button', { type: 'button', class: 'secondary', title: t('move_up'), onclick: () => swap(k, k - 1) }, '↑');
          const down = el('button', { type: 'button', class: 'secondary', title: t('move_down'), onclick: () => swap(k, k + 1) }, '↓');
          up.disabled = k === 0; down.disabled = k === order.length - 1;
          return el('div', { class: 'order-item' }, el('span', { class: 'num' }, `${k + 1}.`), el('span', { class: 'txt' }, byI.get(x).text), up, down);
        }));
      };
      draw();
      parts.push(el('p', { class: 'muted' }, t('order_student_hint')), list);
    }

    function renderQuestions(data) {
      const box = document.getElementById('questions');
      box.replaceChildren(...data.questions.map((q, i) => {
        const parts = [el('h2', {}, `${i + 1}. `, q.text)];
        const kind = q.kind || (data.exam.type === 'text' ? 'text' : 'choice');
        if (kind === 'order') renderOrder(q, parts);
        else if (kind === 'choice' || kind === 'truefalse') {
          q.options.forEach((opt, j) => {
            const value = String(typeof opt === 'object' ? opt.i : j);
            const radio = el('input', { type: 'radio', name: 'q' + q.id, value });
            radio.checked = answers[q.id] === value;
            radio.addEventListener('change', () => { answers[q.id] = value; scheduleSave(); });
            parts.push(el('label', { class: 'choice' }, radio, ' ', typeof opt === 'object' ? opt.text : opt));
          });
        } else {
          const area = el('textarea', { placeholder: t('answer_placeholder') });
          area.value = answers[q.id] || '';
          area.addEventListener('input', () => { answers[q.id] = area.value; scheduleSave(); });
          parts.push(area);
        }
        return el('div', { class: 'card', 'data-qid': q.id }, parts);
      }));
    }

    function showDone() {
      finished = true;
      document.getElementById('attempt').hidden = true;
      document.getElementById('join').hidden = true;
      document.getElementById('done').hidden = false;
    }

    async function loadAttempt() {
      const data = await rpc('get_attempt', { p_token: token });
      document.getElementById('who').textContent = data.name;
      Object.assign(answers, data.answers);
      if (data.submitted) return finishAttempt();
      if (data.exam.status !== 'published') throw new Error(t('err_exam_not_open'));
      // Ответы с этого устройства новее серверных: часть могла не успеть уйти.
      let local = null;
      try { local = JSON.parse(localStorage.getItem(localKey) || 'null'); } catch {}
      if (local && typeof local === 'object') {
        for (const [k, v] of Object.entries(local)) {
          if (answers[k] !== v) { answers[k] = v; dirty = true; }
        }
      }
      renderQuestions(data);
      document.getElementById('attempt').hidden = false;
      setConn('saved');
      startTracking();
      if (submitPending || dirty) flush();
    }

    document.getElementById('join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        token = await rpc('join_exam', { p_code: code, p_name: document.getElementById('name').value });
        try { localStorage.setItem(storeKey, token); } catch {}
        document.getElementById('join').hidden = true;
        await loadAttempt();
      } catch (err) { showError(err); }
    });

    document.getElementById('submit').addEventListener('click', async () => {
      suppress = true; // диалог подтверждения снимает фокус — это не уход
      const ok = confirm(t('submit_q'));
      suppress = false;
      if (!ok) return;
      storeLocal();
      trySubmit();
    });

    (async function start() {
      try {
        const exam = await rpc('exam_by_code', { p_code: code }, 20000);
        document.getElementById('err').textContent = '';
        document.getElementById('title').textContent = exam.title;
        document.title = exam.title + ' — AI Marker';
        if (token) {
          try { return await loadAttempt(); } catch (err) {
            if (err.code !== 'unauthorized') throw err;
            token = null;
          }
        }
        if (exam.status !== 'published') throw new Error(t('err_exam_not_open'));
        document.getElementById('join').hidden = false;
      } catch (err) {
        showError(err);
        // Нет связи при открытии — пробуем ещё раз через несколько секунд.
        if (retryable(err)) setTimeout(start, 5000);
      }
    })();
  </script>
</body>
</html>
