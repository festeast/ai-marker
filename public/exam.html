<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Экзамен — AI Marker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
</head>
<body>
  <header><div class="wrap"><span class="brand" data-i18n="app_name"></span><span class="muted" id="who"></span></div></header>
  <main class="wrap" style="max-width:760px">
    <h1 id="title"></h1>
    <div class="card narrow" id="join" hidden>
      <form id="join-form">
        <label for="name" data-i18n="your_name"></label>
        <input type="text" id="name" autocomplete="name" required>
        <p class="muted" data-i18n="monitor_notice"></p>
        <button type="submit" data-i18n="start"></button>
      </form>
    </div>
    <div id="attempt" hidden>
      <div class="notice" data-i18n="monitor_notice"></div>
      <div id="questions"></div>
      <div class="row spread">
        <span class="muted" id="save-state" data-i18n="autosaved"></span>
        <button id="submit" data-i18n="submit"></button>
      </div>
    </div>
    <div class="card" id="done" hidden><p class="ok" data-i18n="submitted_msg"></p></div>
    <div class="error" id="err"></div>
  </main>
  <script>
    const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    const storeKey = 'attempt:' + code;
    let token = null;
    try { token = localStorage.getItem(storeKey); } catch {}
    const answers = {};
    let finished = false;

    const showError = (err) => { document.getElementById('err').textContent = err.message; };

    // ---------- отслеживание: уход со страницы и вставки ----------
    let away = false, awaySince = 0, suppress = false;

    function sendEvent(type, detail) {
      if (finished) return;
      rpc('log_event', { p_token: token, p_type: type, p_detail: detail }).catch(() => {});
    }
    function markAway(reason) {
      if (away || suppress || finished) return;
      away = true; awaySince = Date.now();
      sendEvent('leave', { reason });
    }
    function markBack() {
      if (!away || document.visibilityState !== 'visible' || !document.hasFocus()) return;
      away = false;
      sendEvent('return', { awayMs: Date.now() - awaySince });
    }
    function startTracking() {
      // Студент закрывал или перезагружал страницу — отмечаем возвращение.
      let closedAt = null;
      try { closedAt = Number(localStorage.getItem(storeKey + ':closedAt')); localStorage.removeItem(storeKey + ':closedAt'); } catch {}
      // Событие при закрытии могло не дойти, поэтому повторяем его (сервер не запишет дубль).
      if (closedAt) {
        rpc('log_event', { p_token: token, p_type: 'leave', p_detail: { reason: 'close' } })
          .finally(() => sendEvent('return', { awayMs: Date.now() - closedAt }));
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') markAway('hidden'); else markBack();
      });
      window.addEventListener('blur', () => markAway('blur'));
      window.addEventListener('focus', markBack);
      window.addEventListener('pagehide', () => {
        if (finished) return;
        try { localStorage.setItem(storeKey + ':closedAt', String(Date.now())); } catch {}
        rpcKeepalive('log_event', { p_token: token, p_type: 'leave', p_detail: { reason: 'close' } });
      });
      document.addEventListener('paste', (e) => {
        const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
        const q = e.target.closest && e.target.closest('[data-qid]');
        sendEvent('paste', { text, questionId: q ? Number(q.dataset.qid) : null });
      });
      document.addEventListener('drop', (e) => {
        const text = (e.dataTransfer && e.dataTransfer.getData('text')) || '';
        if (!text) return;
        const q = e.target.closest && e.target.closest('[data-qid]');
        sendEvent('paste', { text, questionId: q ? Number(q.dataset.qid) : null });
      });
      setInterval(() => { if (!finished) rpc('heartbeat', { p_token: token }).catch(() => {}); }, 10000);
    }

    // ---------- ответы ----------
    let saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => rpc('save_answers', { p_token: token, p_answers: answers }).catch(showError), 800);
    }

    function renderQuestions(data) {
      const box = document.getElementById('questions');
      box.replaceChildren(...data.questions.map((q, i) => {
        const parts = [el('h2', {}, `${i + 1}. `, q.text)];
        if (data.exam.type === 'quiz') {
          q.options.forEach((opt, j) => {
            const radio = el('input', { type: 'radio', name: 'q' + q.id, value: String(j) });
            radio.checked = answers[q.id] === String(j);
            radio.addEventListener('change', () => { answers[q.id] = String(j); scheduleSave(); });
            parts.push(el('label', { class: 'choice' }, radio, ' ', opt));
          });
        } else {
          const area = el('textarea', { placeholder: t('answer_placeholder') });
          area.value = answers[q.id] || '';
          area.addEventListener('input', () => { answers[q.id] = area.value; scheduleSave(); });
          parts.push(area);
        }
        return el('div', { class: 'card', 'data-qid': q.id }, parts);
      }));
    }

    function showDone() {
      finished = true;
      document.getElementById('attempt').hidden = true;
      document.getElementById('join').hidden = true;
      document.getElementById('done').hidden = false;
    }

    async function loadAttempt() {
      const data = await rpc('get_attempt', { p_token: token });
      document.getElementById('who').textContent = data.name;
      Object.assign(answers, data.answers);
      if (data.submitted) return showDone();
      if (data.exam.status !== 'published') throw new Error(t('err_exam_not_open'));
      renderQuestions(data);
      document.getElementById('attempt').hidden = false;
      startTracking();
    }

    document.getElementById('join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        token = await rpc('join_exam', { p_code: code, p_name: document.getElementById('name').value });
        try { localStorage.setItem(storeKey, token); } catch {}
        document.getElementById('join').hidden = true;
        await loadAttempt();
      } catch (err) { showError(err); }
    });

    document.getElementById('submit').addEventListener('click', async () => {
      suppress = true; // диалог подтверждения снимает фокус — это не уход
      const ok = confirm(t('submit_q'));
      suppress = false;
      if (!ok) return;
      try {
        clearTimeout(saveTimer);
        await rpc('submit_attempt', { p_token: token, p_answers: answers });
        showDone();
      } catch (err) { showError(err); }
    });

    (async () => {
      try {
        const exam = await rpc('exam_by_code', { p_code: code });
        document.getElementById('title').textContent = exam.title;
        document.title = exam.title + ' — AI Marker';
        if (token) {
          try { return await loadAttempt(); } catch (err) {
            if (err.code !== 'unauthorized') throw err;
            token = null;
          }
        }
        if (exam.status !== 'published') throw new Error(t('err_exam_not_open'));
        document.getElementById('join').hidden = false;
      } catch (err) { showError(err); }
    })();
  </script>
</body>
</html>
