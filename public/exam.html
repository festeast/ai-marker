<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_exam">Экзамен — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="code-runner.js"></script>
  <script src="calc-engine.js"></script><script src="exam-tools.js"></script>
  <script src="tool-graph.js"></script><script src="periodic-data.js"></script><script src="tool-periodic.js"></script>
</head>
<body>
  <header><div class="wrap"><span class="brand" data-i18n="app_name"></span><span class="muted" id="who"></span></div></header>
  <main class="wrap" style="max-width:760px">
    <h1 id="title"></h1>
    <div class="card narrow" id="join" hidden>
      <form id="join-form">
        <label for="name" data-i18n="your_name"></label>
        <input type="text" id="name" autocomplete="name" required>
        <p class="muted" data-i18n="monitor_notice"></p>
        <button type="submit" data-i18n="start"></button>
      </form>
    </div>
    <div class="card strict-gate" id="gate" hidden>
      <h2 id="gate-title"></h2>
      <p data-i18n="strict_notice"></p>
      <p class="warn" id="gate-leaves"></p>
      <button id="gate-btn"></button>
    </div>
    <div class="card" id="locked" hidden>
      <h2 class="error" data-i18n="locked_title"></h2>
      <p data-i18n="locked_msg"></p>
    </div>
    <div id="attempt" hidden>
      <div class="conn-bar" id="offline" role="status" hidden></div>
      <div class="notice" id="notice" data-i18n="monitor_notice"></div>
      <p class="muted" id="strict-warn" hidden></p>
      <div id="questions"></div>
      <div class="row spread">
        <span class="muted" id="save-state" data-i18n="autosaved"></span>
        <button id="submit" data-i18n="submit"></button>
      </div>
    </div>
    <dialog id="submit-dialog" class="confirm-dialog">
      <p data-i18n="submit_q"></p>
      <div class="row spread">
        <button type="button" class="secondary" id="submit-cancel" data-i18n="cancel"></button>
        <button type="button" id="submit-ok" data-i18n="submit"></button>
      </div>
    </dialog>
    <div class="card" id="done" hidden><p class="ok" data-i18n="submitted_msg"></p></div>
    <div class="error" id="err"></div>
  </main>
  <div class="strict-toast" id="toast" role="alert" hidden></div>
  <script>
    const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    const storeKey = 'attempt:' + code;
    let token = null;
    try { token = localStorage.getItem(storeKey); } catch {}
    const answers = {};
    let finished = false;

    const showError = (err) => { document.getElementById('err').textContent = err.message; };

    // ---------- отслеживание: уход со страницы и вставки ----------
    let away = false, awaySince = 0, suppress = false;

    // ---------- строгий режим ----------
    // Экзамен идёт на весь экран; копирование, вставка, печать и правый клик запрещены.
    // Запретить переход на другую вкладку браузер не даёт, поэтому каждый выход считается,
    // а после maxLeaves выходов сервер блокирует работу, пока учитель её не разблокирует.
    let strict = null, leaves = 0, locked = false, started = false, lockPoll = null;
    let wantFs = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    async function enterFullscreen() {
      const root = document.documentElement;
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!wantFs || !req) return;
      try { await req.call(root); } catch { wantFs = false; } // браузер отказал — работаем без полного экрана
    }
    function leaveFullscreen() {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (inFullscreen() && exit) try { Promise.resolve(exit.call(document)).catch(() => {}); } catch {}
    }

    function showToast() {
      const box = document.getElementById('toast');
      box.textContent = t('strict_blocked');
      box.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { box.hidden = true; }, 2000);
    }

    function updateStrictWarn() {
      const text = strict && strict.maxLeaves
        ? t('strict_lock_warn').replace('{n}', strict.maxLeaves).replace('{k}', leaves) : '';
      const line = document.getElementById('strict-warn');
      line.hidden = !text; line.textContent = text;
      line.className = leaves ? 'warn' : 'muted';
      document.getElementById('gate-leaves').textContent = leaves ? text : '';
    }

    function showGate(back) {
      if (finished || locked) return;
      document.getElementById('gate-title').textContent = t(back ? 'strict_back_title' : 'strict_on');
      document.getElementById('gate-btn').textContent = t(back ? 'strict_back' : 'strict_start');
      document.getElementById('gate').hidden = false;
      document.getElementById('attempt').hidden = true;
    }
    function hideGate() {
      if (finished || locked) return;
      document.getElementById('gate').hidden = true;
      document.getElementById('attempt').hidden = false;
    }

    function lockAttempt() {
      if (locked || finished) return;
      locked = true;
      document.getElementById('attempt').hidden = true;
      document.getElementById('gate').hidden = true;
      document.getElementById('locked').hidden = false;
      // Ждём, пока учитель разблокирует работу.
      clearInterval(lockPoll);
      lockPoll = setInterval(async () => {
        try {
          const data = await rpc('get_attempt', { p_token: token }, 10000);
          if (data.submitted) { clearInterval(lockPoll); return finishAttempt(); }
          if (data.locked) return;
          clearInterval(lockPoll);
          locked = false; leaves = data.leaveCount || 0;
          document.getElementById('locked').hidden = true;
          updateStrictWarn();
          if (wantFs && !inFullscreen()) showGate(true); else hideGate();
          if (dirty || submitPending) flush();
        } catch {}
      }, 5000);
    }

    function startStrict() {
      document.body.classList.add('strict');
      const block = (e) => { if (finished) return; e.preventDefault(); showToast(); };
      document.addEventListener('contextmenu', block);
      document.addEventListener('copy', block);
      document.addEventListener('cut', block);
      document.addEventListener('dragstart', block);
      document.addEventListener('keydown', (e) => {
        const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
        if (e.key === 'F12' || (mod && ['p', 's', 'u', 'o'].includes(k)) || (mod && e.shiftKey && ['i', 'j', 'c'].includes(k))) block(e);
      });
      window.addEventListener('beforeunload', (e) => {
        if (finished || locked || submitPending) return;
        e.preventDefault(); e.returnValue = t('leave_warn');
      });
      const onFs = () => {
        if (!started || finished || locked) return;
        if (inFullscreen()) { hideGate(); markBack(); }
        else if (wantFs && !suppress) { markAway('fullscreen'); showGate(true); }
      };
      document.addEventListener('fullscreenchange', onFs);
      document.addEventListener('webkitfullscreenchange', onFs);
      document.getElementById('gate-btn').addEventListener('click', async () => {
        await enterFullscreen();
        if (!started) { started = true; startTracking(); }
        hideGate();
        markBack();
      });
      updateStrictWarn();
      showGate(false);
    }

    function sendEvent(type, detail) {
      if (finished) return;
      if (eventQueue.length < 200) eventQueue.push({ type, detail });
      flushEvents();
    }
    function markAway(reason) {
      if (away || suppress || finished) return;
      away = true; awaySince = Date.now();
      sendEvent('leave', { reason });
      if (strict) {
        leaves++;
        updateStrictWarn();
        if (strict.maxLeaves && leaves >= strict.maxLeaves) lockAttempt();
      }
    }
    function markBack() {
      if (!away || document.visibilityState !== 'visible' || !document.hasFocus()) return;
      if (strict && wantFs && !inFullscreen()) return; // вернётся, когда снова откроет экзамен на весь экран
      away = false;
      sendEvent('return', { awayMs: Date.now() - awaySince });
    }
    function startTracking() {
      // Студент закрывал или перезагружал страницу — отмечаем возвращение.
      let closedAt = null;
      try { closedAt = Number(localStorage.getItem(storeKey + ':closedAt')); localStorage.removeItem(storeKey + ':closedAt'); } catch {}
      // Событие при закрытии могло не дойти, поэтому повторяем его (сервер не запишет дубль).
      if (closedAt) {
        rpc('log_event', { p_token: token, p_type: 'leave', p_detail: { reason: 'close' } })
          .finally(() => sendEvent('return', { awayMs: Date.now() - closedAt }));
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') markAway('hidden'); else markBack();
      });
      window.addEventListener('blur', () => markAway('blur'));
      window.addEventListener('focus', markBack);
      window.addEventListener('pagehide', () => {
        if (finished) return;
        try { localStorage.setItem(storeKey + ':closedAt', String(Date.now())); } catch {}
        rpcKeepalive('log_event', { p_token: token, p_type: 'leave', p_detail: { reason: 'close' } });
      });
      // В строгом режиме вставка запрещена, но попытка всё равно записывается.
      document.addEventListener('paste', (e) => {
        const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
        const q = e.target.closest && e.target.closest('[data-qid]');
        if (strict) { e.preventDefault(); showToast(); }
        sendEvent('paste', { text, questionId: q ? Number(q.dataset.qid) : null, blocked: !!strict });
      });
      document.addEventListener('drop', (e) => {
        const text = (e.dataTransfer && e.dataTransfer.getData('text')) || '';
        if (strict) { e.preventDefault(); if (text) showToast(); }
        if (!text) return;
        const q = e.target.closest && e.target.closest('[data-qid]');
        sendEvent('paste', { text, questionId: q ? Number(q.dataset.qid) : null, blocked: !!strict });
      });
      setInterval(() => {
        if (finished || !online) return;
        rpc('heartbeat', { p_token: token }, 10000).catch((err) => { if (retryable(err)) goOffline(); });
      }, 10000);
    }

    // ---------- связь ----------
    // Ответы сначала сохраняются на этом устройстве, а на сервер уходят, когда есть интернет.
    // Если связь пропала, страница сама повторяет отправку; сдача работы тоже ждёт связи.
    const localKey = storeKey + ':answers', submitKey = storeKey + ':submit';
    const eventQueue = [];
    let saveTimer = null, retryTimer = null, retryDelay = 2000;
    let dirty = false, busy = false, submitting = false, sendingEvents = false, online = true, submitPending = false;
    try { submitPending = localStorage.getItem(submitKey) === '1'; } catch {}
    const retryable = (err) => err.code === 'network' || err.code === 'server_error';

    function setConn(state) {
      const line = document.getElementById('save-state');
      line.textContent = t('conn_' + state);
      line.className = state === 'offline' || state === 'submit_waiting' ? 'warn' : 'muted';
      const bar = document.getElementById('offline');
      bar.hidden = !(state === 'offline' || state === 'submit_waiting');
      bar.textContent = t('conn_' + state);
      document.getElementById('submit').disabled = submitPending;
    }

    function storeLocal() {
      try { localStorage.setItem(localKey, JSON.stringify(answers)); } catch {}
    }

    function goOffline() {
      online = false;
      setConn(submitPending ? 'submit_waiting' : 'offline');
      clearTimeout(retryTimer);
      retryTimer = setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    }
    function backOnline() {
      online = true; retryDelay = 2000;
    }

    function scheduleSave() {
      storeLocal();
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 800);
    }

    // Отправляет то, что ещё не дошло: сдачу работы, ответы, события.
    async function flush() {
      clearTimeout(retryTimer);
      if (finished) return;
      if (submitPending) return trySubmit();
      if (busy) return;
      if (!dirty) { if (!online) await pingServer(); return flushEvents(); }
      busy = true; dirty = false;
      if (online) setConn('saving');
      try {
        await rpc('save_answers', { p_token: token, p_answers: answers }, 15000);
        backOnline();
        setConn(dirty ? 'saving' : 'saved');
      } catch (err) {
        dirty = true;
        if (retryable(err)) goOffline();
        else if (err.code === 'attempt_locked') lockAttempt();
        else showError(err);
      } finally { busy = false; }
      if (online) { if (dirty) saveTimer = setTimeout(flush, 800); flushEvents(); }
    }

    async function pingServer() {
      try { await rpc('heartbeat', { p_token: token }, 10000); backOnline(); setConn('saved'); } catch { goOffline(); }
    }

    async function flushEvents() {
      if (sendingEvents || !online) return;
      sendingEvents = true;
      try {
        while (eventQueue.length && !finished) {
          const e = eventQueue[0];
          try {
            await rpc('log_event', { p_token: token, p_type: e.type, p_detail: e.detail }, 15000);
          } catch (err) {
            if (retryable(err)) { goOffline(); return; }
          }
          eventQueue.shift();
        }
      } finally { sendingEvents = false; }
    }

    async function trySubmit() {
      if (submitting) return;
      submitPending = true;
      try { localStorage.setItem(submitKey, '1'); } catch {}
      clearTimeout(saveTimer);
      submitting = true;
      setConn('submitting');
      try {
        await rpc('submit_attempt', { p_token: token, p_answers: answers }, 20000);
        finishAttempt();
      } catch (err) {
        if (err.code === 'already_submitted') finishAttempt();
        else if (retryable(err)) goOffline();
        else {
          submitPending = false;
          try { localStorage.removeItem(submitKey); } catch {}
          setConn('saved');
          if (err.code === 'attempt_locked') lockAttempt(); else showError(err);
        }
      } finally { submitting = false; }
    }

    function finishAttempt() {
      try { localStorage.removeItem(localKey); localStorage.removeItem(submitKey); } catch {}
      showDone();
    }

    window.addEventListener('online', () => { if (!online) { retryDelay = 2000; flush(); } });

    // Вопрос «по порядку»: ответ — номера элементов (как у учителя) через запятую в порядке ученика.
    function renderOrder(q, parts) {
      const byI = new Map(q.options.map((o) => [o.i, o]));
      let order = (answers[q.id] || '').split(',').filter((x) => x !== '').map(Number);
      if (order.length !== q.options.length || !order.every((x) => byI.has(x))) order = q.options.map((o) => o.i);
      answers[q.id] = order.join(',');
      const list = el('div', { class: 'order-list' });
      const draw = () => {
        list.replaceChildren(...order.map((x, k) => {
          const swap = (a, b) => { [order[a], order[b]] = [order[b], order[a]]; answers[q.id] = order.join(','); scheduleSave(); draw(); };
          const up = el('button', { type: 'button', class: 'secondary', title: t('move_up'), onclick: () => swap(k, k - 1) }, '↑');
          const down = el('button', { type: 'button', class: 'secondary', title: t('move_down'), onclick: () => swap(k, k + 1) }, '↓');
          up.disabled = k === 0; down.disabled = k === order.length - 1;
          return el('div', { class: 'order-item' }, el('span', { class: 'num' }, `${k + 1}.`), el('span', { class: 'txt' }, byI.get(x).text), up, down);
        }));
      };
      draw();
      parts.push(el('p', { class: 'muted' }, t('order_student_hint')), list);
    }

    // Вопрос с кодом: редактор, ввод для запуска и кнопка «Запустить». Ответ — сам код.
    function renderCode(q, parts) {
      const area = CodeRunner.editor(el('textarea', { rows: 14, 'aria-label': t('answer') }));
      area.value = answers[q.id] ?? q.starter ?? '';
      area.addEventListener('input', () => { answers[q.id] = area.value; scheduleSave(); });
      area.addEventListener('focus', () => CodeRunner.preload(q.lang), { once: true });
      const stdin = el('textarea', { class: 'code-small', rows: 3, spellcheck: 'false' });
      const status = el('span', { class: 'muted' });
      const out = el('div');
      const btn = el('button', { type: 'button', class: 'secondary' }, t('code_run'));
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        status.className = 'muted';
        out.replaceChildren();
        try {
          const res = await CodeRunner.run(q.lang, area.value, [stdin.value], (k) => { status.textContent = t(k); }, { echo: true });
          out.replaceChildren(CodeRunner.resultView(res));
          status.textContent = t('code_finished');
        } catch (err) {
          status.className = 'error';
          status.textContent = err.message;
        } finally { btn.disabled = false; }
      });
      parts.push(
        el('p', { class: 'muted' }, el('span', { class: 'badge' }, CodeRunner.langName(q.lang)), ' ', t('code_student_hint')),
        area,
        el('details', { style: 'margin-top:8px' }, el('summary', { class: 'muted' }, t('code_stdin')), stdin),
        el('div', { class: 'row', style: 'margin-top:8px' }, btn, status),
        out);
    }

    function renderQuestions(data) {
      const box = document.getElementById('questions');
      box.replaceChildren(...data.questions.map((q, i) => {
        const parts = [el('h2', {}, `${i + 1}. `, q.text)];
        const kind = q.kind || (data.exam.type === 'text' ? 'text' : 'choice');
        if (kind === 'order') renderOrder(q, parts);
        else if (kind === 'code') renderCode(q, parts);
        else if (kind === 'choice' || kind === 'truefalse') {
          q.options.forEach((opt, j) => {
            const value = String(typeof opt === 'object' ? opt.i : j);
            const radio = el('input', { type: 'radio', name: 'q' + q.id, value });
            radio.checked = answers[q.id] === value;
            radio.addEventListener('change', () => { answers[q.id] = value; scheduleSave(); });
            parts.push(el('label', { class: 'choice' }, radio, ' ', typeof opt === 'object' ? opt.text : opt));
          });
        } else {
          const area = el('textarea', { placeholder: t('answer_placeholder') });
          area.value = answers[q.id] || '';
          area.addEventListener('input', () => { answers[q.id] = area.value; scheduleSave(); });
          parts.push(area);
        }
        return el('div', { class: 'card', 'data-qid': q.id }, parts);
      }));
    }

    function showDone() {
      finished = true;
      clearInterval(lockPoll);
      leaveFullscreen();
      for (const id of ['gate', 'locked']) document.getElementById(id).hidden = true;
      document.getElementById('attempt').hidden = true;
      document.getElementById('join').hidden = true;
      document.getElementById('done').hidden = false;
      ExamTools.unmount();
    }

    async function loadAttempt() {
      const data = await rpc('get_attempt', { p_token: token });
      document.getElementById('who').textContent = data.name;
      Object.assign(answers, data.answers);
      if (data.submitted) return finishAttempt();
      if (data.exam.status !== 'published') throw new Error(t('err_exam_not_open'));
      // Ответы с этого устройства новее серверных: часть могла не успеть уйти.
      let local = null;
      try { local = JSON.parse(localStorage.getItem(localKey) || 'null'); } catch {}
      if (local && typeof local === 'object') {
        for (const [k, v] of Object.entries(local)) {
          if (answers[k] !== v) { answers[k] = v; dirty = true; }
        }
      }
      renderQuestions(data);
      ExamTools.mount(data.exam.tools, {
        sheet: data.exam.toolsSheet, storeKey, requests: data.exam.toolRequests,
        ask: (tool) => rpc('request_tool', { p_token: token, p_tool: tool }, 15000),
        refresh: () => (finished || !online ? Promise.resolve(null) : rpc('attempt_tools', { p_token: token }, 10000)),
      });
      setConn('saved');
      if (data.exam.strictMode) {
        strict = { maxLeaves: data.exam.maxLeaves || null };
        leaves = data.leaveCount || 0;
        document.getElementById('notice').textContent = t('strict_notice');
        startStrict();
        if (data.locked) lockAttempt();
      } else {
        document.getElementById('attempt').hidden = false;
        startTracking();
      }
      if (submitPending || dirty) flush();
    }

    document.getElementById('join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        token = await rpc('join_exam', { p_code: code, p_name: document.getElementById('name').value });
        try { localStorage.setItem(storeKey, token); } catch {}
        document.getElementById('join').hidden = true;
        await loadAttempt();
      } catch (err) { showError(err); }
    });

    // Подтверждение сдачи — окно внутри страницы, а не confirm(): системное окно выводит браузер
    // из полного экрана и снимает фокус, и в строгом режиме это засчитывалось как выход.
    const submitDialog = document.getElementById('submit-dialog');
    document.getElementById('submit').addEventListener('click', () => submitDialog.showModal());
    document.getElementById('submit-cancel').addEventListener('click', () => submitDialog.close());
    document.getElementById('submit-ok').addEventListener('click', () => {
      submitDialog.close();
      storeLocal();
      trySubmit();
    });

    (async function start() {
      try {
        const exam = await rpc('exam_by_code', { p_code: code }, 20000);
        document.getElementById('err').textContent = '';
        document.getElementById('title').textContent = exam.title;
        document.title = exam.title + ' — AI Marker';
        if (token) {
          try { return await loadAttempt(); } catch (err) {
            if (err.code !== 'unauthorized') throw err;
            token = null;
          }
        }
        if (exam.status !== 'published') throw new Error(t('err_exam_not_open'));
        document.getElementById('join').hidden = false;
      } catch (err) {
        showError(err);
        // Нет связи при открытии — пробуем ещё раз через несколько секунд.
        if (retryable(err)) setTimeout(start, 5000);
      }
    })();
  </script>
</body>
</html>
