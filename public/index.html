<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Marker</title>
  <link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="/" data-i18n="app_name"></a><a href="/teacher" data-i18n="teacher_login"></a></div></header>
  <main class="wrap narrow">
    <div class="card">
      <p class="muted" data-i18n="student_intro"></p>
      <form id="code-form">
        <label for="code" data-i18n="enter_code"></label>
        <input type="text" id="code" autocomplete="off" style="text-transform:uppercase" required>
        <div class="error" id="err"></div>
        <button type="submit" data-i18n="go"></button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById('code-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value.trim().toUpperCase();
      try {
        await api('GET', '/api/public/exams/' + encodeURIComponent(code));
        location.href = '/e/' + code;
      } catch (err) { document.getElementById('err').textContent = err.message; }
    });
  </script>
</body>
</html>
