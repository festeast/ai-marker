<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_monitor">Мониторинг — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script>
</head>
<body>
  <main class="wrap">
    <p><a href="teacher.html" data-i18n="back"></a></p>
    <div class="card">
      <div class="row spread">
        <h1 id="title" style="margin:0"></h1>
        <span class="badge" id="status"></span>
      </div>
      <p class="muted" id="strict-info" hidden></p>
      <div id="share" hidden>
        <label data-i18n="code"></label>
        <div class="row"><span class="code-box" id="code"></span><button class="secondary small" id="copy-code" data-i18n="copy"></button></div>
        <label data-i18n="link"></label>
        <div class="row"><a id="link" target="_blank"></a><button class="secondary small" id="copy-link" data-i18n="copy"></button></div>
      </div>
      <p class="row"><a class="btn secondary" id="results-link" data-i18n="results"></a>
        <button class="danger small" id="close" hidden data-i18n="close_exam"></button></p>
    </div>
    <div class="card" id="tool-requests" hidden></div>
    <details class="card" id="tools-box" hidden>
      <summary><b data-i18n="tools_title"></b> <span class="muted" id="tools-summary"></span></summary>
      <div id="tools" style="margin-top:12px"></div>
    </details>
    <div class="card">
      <h2 data-i18n="participants"></h2>
      <div id="participants"></div>
    </div>
    <div class="card">
      <div class="row spread">
        <h2 data-i18n="events"></h2>
        <label class="muted" style="margin:0"><input type="checkbox" id="only-flagged"> <span data-i18n="only_flagged"></span></label>
      </div>
      <ul class="events" id="events"></ul>
    </div>
    <div class="error" id="err"></div>
  </main>
  <script>
    const id = Number(new URLSearchParams(location.search).get('id'));
    document.getElementById('results-link').href = 'results.html?id=' + id;
    let lastEventId = 0;
    let toolsShown = false, toolsExam = null;

    // Инструменты можно включить и во время экзамена (ученик увидит их после перезагрузки страницы).
    function showTools(exam) {
      const box = document.getElementById('tools-box');
      const summary = () => {
        document.getElementById('tools-summary').textContent = (exam.tools || []).length
          ? '— ' + exam.tools.map((k) => t('tool_' + k)).join(', ') : '— ' + t('tools_none');
      };
      toolsExam = exam;
      exam.refreshTools = () => { renderToolsEditor(document.getElementById('tools'), exam, { heading: false, onSave: summary }); summary(); };
      renderToolsEditor(document.getElementById('tools'), exam, { heading: false, onSave: summary });
      summary();
      box.hidden = false;
    }
    const events = [];

    function copy(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = t('copied');
        setTimeout(() => { btn.textContent = t('copy'); }, 1500);
      });
    }

    function isFlagged(e) {
      return e.type === 'leave' || e.type === 'lock' || (e.type === 'paste' && e.detail && (e.detail.large || e.detail.blocked));
    }

    function eventText(e) {
      const d = e.detail || {};
      switch (e.type) {
        case 'join': return t('ev_join');
        case 'leave': return d.reason === 'close' ? t('ev_leave_close') : d.reason === 'fullscreen' ? t('ev_leave_fullscreen') : t('ev_leave');
        case 'return': return `${t('ev_return')} ${fmtDuration(d.awayMs || 0)}`;
        case 'paste': if (d.blocked) return `${t('ev_paste_blocked')}: ${d.length} ${t('chars')}`;
          return `${t('ev_paste')}: ${d.length} ${t('chars')}${d.large ? ' — ' + t('large') : ''}`;
        case 'submit': return t('ev_submit');
        case 'lock': return t('ev_lock');
        case 'unlock': return t('ev_unlock');
        default: return e.type;
      }
    }

    function renderEvents() {
      const onlyFlagged = document.getElementById('only-flagged').checked;
      const list = events.filter((e) => !onlyFlagged || isFlagged(e)).slice().reverse();
      document.getElementById('events').replaceChildren(...list.map((e) => el('li', { class: isFlagged(e) ? 'flag' : '' },
        el('span', { class: 'muted' }, fmtTime(e.createdAt) + ' '), el('b', {}, e.name), ' — ', eventText(e),
        e.type === 'paste' && e.detail && e.detail.snippet ? el('span', { class: 'snippet' }, e.detail.snippet) : null,
      )));
    }

    function renderParticipants(data) {
      const box = document.getElementById('participants');
      if (!data.participants.length) { box.replaceChildren(el('p', { class: 'muted' }, t('no_participants'))); return; }
      const isQuiz = data.exam.type !== 'text';
      const head = el('tr', {}, ['col_student', 'col_status', 'col_left', 'col_away', 'col_pastes', 'col_answered']
        .concat(isQuiz ? ['col_score'] : []).map((k) => el('th', {}, t(k))));
      const rows = data.participants.map((p) => el('tr', { class: p.leaveCount || p.largePasteCount ? 'flagged' : '' },
        el('td', {}, el('b', {}, p.name), el('br'), el('span', { class: 'muted' }, fmtTime(p.joinedAt))),
        el('td', {}, el('span', { class: 'badge ' + p.status }, t('st_' + p.status)),
          p.status === 'locked' ? el('button', { class: 'secondary small', style: 'margin-left:6px', onclick: (e) => unlock(p, e.target) }, t('unlock')) : null),
        el('td', {}, p.leaveCount ? el('span', { class: 'badge flag' }, String(p.leaveCount)) : '0'),
        el('td', {}, p.awayMs ? fmtDuration(p.awayMs) : '—'),
        el('td', {}, p.largePasteCount ? el('span', { class: 'badge flag' }, String(p.largePasteCount)) : '0'),
        el('td', {}, `${p.answeredCount} / ${data.questionCount}`),
        isQuiz ? el('td', {}, p.score ? `${p.score.correct} / ${p.score.total}` : '—') : null,
      ));
      box.replaceChildren(el('div', { class: 'table-scroll' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
    }

    async function unlock(p, btn) {
      btn.disabled = true;
      try { await rpc('unlock_participant', { p_participant_id: p.id }); }
      catch (err) { btn.disabled = false; document.getElementById('err').textContent = err.message; }
    }

    // Запросы инструментов от учеников: дать одному, всем, кто попросил, или всем ученикам.
    const TOOL_ICONS = { calculator: '🧮', graph: '📈', code: '💻', periodic: '⚛', sheet: '📄' };
    let reqSig = '';
    function renderToolRequests(data, force) {
      const sig = JSON.stringify(data.requests);
      if (sig === reqSig && !force) return;
      reqSig = sig;
      const box = document.getElementById('tool-requests');
      box.hidden = !data.requests.length;
      if (toolsExam && JSON.stringify(toolsExam.tools) !== JSON.stringify(data.tools)) { toolsExam.tools = data.tools; toolsExam.refreshTools(); }
      const msg = el('span', { class: 'error' });
      const decide = (tool, grant, scope, participantId) => async (e) => {
        e.target.disabled = true;
        try {
          renderToolRequests(await rpc('decide_tool_requests', { p_exam_id: id, p_tool: tool, p_grant: grant, p_scope: scope, p_participant_id: participantId ?? null }), true);
        } catch (err) { msg.textContent = err.message; e.target.disabled = false; }
      };
      const pending = data.requests.filter((r) => r.status === 'pending');
      const groups = [...new Set(pending.map((r) => r.tool))].map((tool) => {
        const list = pending.filter((r) => r.tool === tool);
        return el('div', { class: 'tool-req' },
          el('b', {}, TOOL_ICONS[tool] + ' ' + t('tool_' + tool)), ' ', el('span', { class: 'muted' }, t('tool_req_asked') + ': ' + list.length),
          list.map((r) => el('div', { class: 'row', style: 'margin-top:6px' },
            el('span', {}, r.name), el('span', { class: 'muted' }, fmtTime(r.createdAt)),
            el('button', { class: 'small', onclick: decide(tool, true, 'one', r.participantId) }, t('tool_grant')),
            el('button', { class: 'secondary small', onclick: decide(tool, false, 'one', r.participantId) }, t('tool_deny')))),
          el('div', { class: 'row', style: 'margin-top:8px' },
            list.length > 1 ? el('button', { class: 'small', onclick: decide(tool, true, 'requested') }, t('tool_grant_requested')) : null,
            el('button', { class: 'secondary small', onclick: decide(tool, true, 'everyone') }, t('tool_grant_everyone')),
            list.length > 1 ? el('button', { class: 'danger small', onclick: decide(tool, false, 'requested') }, t('tool_deny_requested')) : null));
      });
      const done = data.requests.filter((r) => r.status !== 'pending');
      box.replaceChildren(
        el('h2', {}, t('tool_requests'), pending.length ? el('span', { class: 'badge flag', style: 'margin-left:8px' }, String(pending.length)) : null),
        groups.length ? el('div', {}, groups) : el('p', { class: 'muted' }, t('tool_req_none')),
        done.length ? el('details', { style: 'margin-top:8px' }, el('summary', { class: 'muted' }, t('tool_req_done') + ': ' + done.length),
          el('ul', { class: 'events' }, done.map((r) => el('li', {}, el('b', {}, r.name), ' — ', t('tool_' + r.tool + '_short'), ': ', t('tool_req_' + r.status))))) : null,
        msg);
    }
    async function pollToolRequests() {
      try { renderToolRequests(await rpc('list_tool_requests', { p_exam_id: id })); } catch {}
      setTimeout(pollToolRequests, 5000);
    }

    async function poll() {
      try {
        const data = await rpc('exam_monitor', { p_exam_id: id, p_after: lastEventId });
        const x = data.exam;
        document.getElementById('title').textContent = x.title;
        const status = document.getElementById('status');
        status.textContent = t('status_' + x.status); status.className = 'badge ' + x.status;
        if (x.status === 'draft') { location.href = 'edit.html?id=' + id; return; }
        const info = document.getElementById('strict-info');
        info.hidden = !x.strictMode;
        info.textContent = x.strictMode ? t('strict_on') + (x.maxLeaves ? ': ' + t('strict_lock_after').replace('{n}', x.maxLeaves) : '') : '';
        document.getElementById('share').hidden = x.status !== 'published';
        document.getElementById('close').hidden = x.status !== 'published';
        document.getElementById('code').textContent = x.code;
        const link = document.getElementById('link');
        link.textContent = link.href = examLink(x.code);
        if (!toolsShown && x.status !== 'closed') { toolsShown = true; showTools(x); }
        renderParticipants(data);
        if (data.events.length) {
          events.push(...data.events);
          lastEventId = data.events[data.events.length - 1].id;
          renderEvents();
        }
      } catch (err) {
        document.getElementById('err').textContent = err.message;
      } finally {
        setTimeout(poll, 3000);
      }
    }

    document.getElementById('copy-code').addEventListener('click', (e) => copy(document.getElementById('code').textContent, e.target));
    document.getElementById('copy-link').addEventListener('click', (e) => copy(document.getElementById('link').href, e.target));
    document.getElementById('only-flagged').addEventListener('change', renderEvents);
    document.getElementById('close').addEventListener('click', async () => {
      if (!confirm(t('close_exam_q'))) return;
      await rpc('close_exam', { p_exam_id: id });
    });

    requireLogin().then(() => { poll(); pollToolRequests(); }).catch(showPageError);
  </script>
</body>
</html>
