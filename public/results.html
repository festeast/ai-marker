<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ответы и оценки — AI Marker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script>
</head>
<body>
  <main class="wrap">
    <p class="row"><a href="teacher.html" data-i18n="back"></a> · <a id="monitor-link" data-i18n="monitor"></a></p>
    <div class="card">
      <h1 id="title" style="margin:0 0 12px"></h1>
      <div id="summary"></div>
      <div id="ai-box" hidden style="margin-top:16px">
        <div class="row">
          <label class="row" style="margin:0"><span data-i18n="ai_model"></span>
            <select id="ai-quality">
              <option value="free" data-i18n="ai_model_free"></option>
              <option value="paid" data-i18n="ai_model_paid"></option>
            </select>
          </label>
        </div>
        <div class="row" style="margin-top:8px"><button id="ai-all" data-i18n="ai_grade_all"></button><span id="ai-msg" class="muted"></span></div>
        <p class="muted" data-i18n="ai_hint"></p>
      </div>
    </div>
    <div class="card" id="analysis-card" hidden>
      <h2 data-i18n="class_analysis"></h2>
      <div id="analysis"></div>
    </div>
    <details class="card" id="meta-card">
      <summary><b data-i18n="class_and_materials"></b> <span class="muted" id="meta-summary"></span></summary>
      <div id="meta"></div>
    </details>
    <div id="students"></div>
    <div class="error" id="err"></div>
  </main>
  <script>
    const id = Number(new URLSearchParams(location.search).get('id'));
    document.getElementById('monitor-link').href = 'monitor.html?id=' + id;
    let data;

    function fmtScore(n) {
      return n === null || n === undefined ? '—' : String(Math.round(Number(n) * 100) / 100);
    }

    function sourceLabel(source) {
      return source ? t('by_' + source) : '';
    }

    function renderSummary() {
      const box = document.getElementById('summary');
      if (!data.participants.length) { box.replaceChildren(el('p', { class: 'muted' }, t('no_results'))); return; }
      const qn = data.questions.length;
      const head = el('tr', {}, [t('col_student'), t('col_status'), t('total'), t('graded')].map((h) => el('th', {}, h)));
      const rows = data.participants.map((p) => el('tr', {},
        el('td', {}, el('a', { href: '#p' + p.id }, p.name)),
        el('td', {}, p.submittedAt ? el('span', { class: 'badge submitted' }, t('st_submitted')) : el('span', { class: 'muted' }, t('not_submitted'))),
        el('td', {}, el('b', {}, fmtScore(p.total)), ` ${t('of')} ${data.maxScore}`),
        el('td', {}, `${p.gradedCount} / ${qn}`),
      ));
      box.replaceChildren(el('div', { class: 'table-scroll' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
    }

    // Анализ класса по сданным и полностью оценённым работам.
    function renderAnalysis() {
      const card = document.getElementById('analysis-card');
      const qn = data.questions.length;
      const submitted = data.participants.filter((p) => p.submittedAt);
      const graded = submitted.filter((p) => p.gradedCount >= qn && data.maxScore > 0);
      card.hidden = !submitted.length;
      if (!submitted.length) return;
      const box = document.getElementById('analysis');
      if (!graded.length) { box.replaceChildren(el('p', { class: 'muted' }, t('analysis_wait'))); return; }

      const pcts = graded.map((p) => ({ name: p.name, id: p.id, pct: Number(p.total) * 100 / data.maxScore })).sort((a, b) => b.pct - a.pct);
      const avg = pcts.reduce((s, x) => s + x.pct, 0) / pcts.length;
      const mid = pcts.length % 2 ? pcts[(pcts.length - 1) / 2].pct : (pcts[pcts.length / 2 - 1].pct + pcts[pcts.length / 2].pct) / 2;
      const stat = (num, label, cls) => el('div', { class: 'stat' }, el('div', { class: 'num ' + (cls || '') }, num), el('div', { class: 'muted' }, label));

      const dist = [5, 4, 3, 2].map((g) => ({ g, n: pcts.filter((x) => gradeFor(x.pct) === g).length }));
      const bars = el('div', { class: 'bars' }, dist.map((d) => el('div', { class: 'bar-row' },
        el('span', {}, `«${d.g}» `, el('span', { class: 'muted' }, t('grade_range_' + d.g))),
        el('div', { class: 'bar g' + d.g }, el('span', { style: `width:${d.n * 100 / pcts.length}%` })),
        el('span', {}, String(d.n)))));

      // Средний процент по каждому вопросу: сначала самые трудные.
      const perQ = data.questions.map((q, i) => {
        const scores = graded.map((p) => p.answers[q.id] && p.answers[q.id].score).filter((v) => v !== undefined && v !== null);
        const pct = scores.length ? scores.reduce((s, v) => s + Number(v), 0) * 100 / (scores.length * q.points) : null;
        return { i, q, pct };
      }).sort((a, b) => (a.pct ?? 101) - (b.pct ?? 101));
      const qRows = perQ.map((x) => el('div', { class: 'bar-row' },
        el('span', { title: x.q.text }, `${t('question')} ${x.i + 1}`),
        el('div', { class: 'bar' }, el('span', { style: `width:${x.pct ?? 0}%` })),
        el('span', { class: pctClass(x.pct) }, fmtPct(x.pct))));
      const hardest = perQ.filter((x) => x.pct !== null && x.pct < 50);
      const weak = pcts.filter((x) => x.pct < 40);

      box.replaceChildren(...[
        el('div', { class: 'stats' },
          stat(fmtPct(avg), t('avg_result'), pctClass(avg)),
          stat(fmtPct(mid), t('median_result')),
          stat(`${fmtPct(pcts[0].pct)} / ${fmtPct(pcts[pcts.length - 1].pct)}`, t('best_worst')),
          stat(`${graded.length} / ${submitted.length}`, t('graded_works'))),
        graded.length < submitted.length ? el('p', { class: 'muted' }, t('analysis_partial')) : null,
        el('h3', {}, t('grade_distribution')), bars,
        el('h3', { style: 'margin-top:16px' }, t('per_question')), el('div', { class: 'bars' }, qRows),
        hardest.length ? el('p', {}, el('b', {}, t('hard_questions') + ': '),
          hardest.map((x) => `${x.i + 1}. ${x.q.text.length > 60 ? x.q.text.slice(0, 60) + '…' : x.q.text}`).join('; ')) : null,
        weak.length ? el('p', {}, el('b', {}, t('need_help') + ': '),
          ...weak.flatMap((x, k) => [k ? ', ' : '', el('a', { href: '#p' + x.id }, x.name), ` (${fmtPct(x.pct)})`])) : null,
      ].filter(Boolean));
    }

    function gradeForm(p, q, a) {
      const score = el('input', { type: 'number', min: 0, max: q.points, step: 0.5, style: 'width:90px' });
      if (a.score !== undefined) score.value = a.score;
      const comment = el('input', { type: 'text', placeholder: t('comment_placeholder') });
      comment.value = a.comment || '';
      const msg = el('span', { class: 'muted' }, sourceLabel(a.source));
      const save = el('button', { class: 'small', onclick: async () => {
        msg.className = 'muted'; msg.textContent = '';
        try {
          if (score.value === '') throw appError('invalid_score');
          await rpc('set_grade', { p_participant_id: p.id, p_question_id: q.id, p_score: Number(score.value), p_comment: comment.value });
          await load();
        } catch (err) { msg.className = 'error'; msg.textContent = err.message; }
      } }, t('save'));
      return el('div', {},
        el('div', { class: 'row', style: 'margin-top:8px' }, el('span', {}, t('score') + ':'), score, el('span', { class: 'muted' }, `${t('of')} ${q.points}`), save, msg),
        el('div', { style: 'margin-top:6px' }, comment));
    }

    function renderStudents() {
      const isQuiz = data.exam.type === 'quiz';
      document.getElementById('students').replaceChildren(...data.participants.map((p) => {
        const items = data.questions.map((q, i) => {
          const a = p.answers[q.id] || {};
          const parts = [el('div', { class: 'row spread' },
            el('b', {}, `${i + 1}. ${q.text}`),
            el('span', { class: 'muted' }, `${fmtScore(a.score)} / ${q.points}`))];
          if (isQuiz) {
            const chosen = a.value !== undefined ? q.options[Number(a.value)] : null;
            const ok = a.value === String(q.correctIndex);
            parts.push(el('p', {}, `${t('answer')}: `, chosen === null ? el('span', { class: 'muted' }, t('no_answer')) : el('span', { class: ok ? 'ok' : 'error' }, (ok ? '✓ ' : '✗ ') + chosen)));
            if (!ok) parts.push(el('p', { class: 'muted' }, `${t('correct_answer')}: ${q.options[q.correctIndex]}`));
          } else {
            parts.push(a.value ? el('span', { class: 'snippet' }, a.value) : el('p', { class: 'muted' }, t('no_answer')));
            if (q.reference) parts.push(el('p', { class: 'muted' }, `${t('reference')}: ${q.reference}`));
            parts.push(gradeForm(p, q, a));
          }
          return el('div', { class: 'question' }, parts);
        });
        const aiOne = !isQuiz && p.submittedAt ? el('button', { class: 'secondary small', onclick: (e) => gradeWithAi([p], e.target) }, t('ai_grade_one')) : null;
        return el('div', { class: 'card', id: 'p' + p.id },
          el('div', { class: 'row spread' }, el('h2', { style: 'margin:0' }, p.name),
            el('span', { class: 'row' }, aiOne, el('span', {}, el('b', {}, fmtScore(p.total)), ` ${t('of')} ${data.maxScore}`))),
          items);
      }));
    }

    // ИИ оценивает студентов по одному, чтобы каждый запрос был коротким.
    let aiRunning = false;
    async function gradeWithAi(students, button) {
      if (aiRunning) return;
      aiRunning = true;
      const msg = document.getElementById('ai-msg');
      msg.className = 'muted';
      document.querySelectorAll('#ai-all, #ai-quality, #students button').forEach((b) => { b.disabled = true; });
      try {
        for (let i = 0; i < students.length; i++) {
          msg.textContent = `${t('ai_grading')}: ${students[i].name} (${i + 1} / ${students.length})…`;
          await callFunction('grade', { examId: id, participantId: students[i].id, quality: quality.value });
        }
        msg.className = 'ok';
        msg.textContent = t('ai_done');
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
      } finally {
        aiRunning = false;
        await load().catch(showPageError);
        refreshAiUsage();
        document.getElementById('ai-all').disabled = false;
        quality.disabled = false;
        if (button) document.getElementById('ai-box').scrollIntoView({ block: 'nearest' });
      }
    }

    // Модель ИИ: бесплатная по умолчанию, выбор запоминается в браузере.
    const quality = document.getElementById('ai-quality');
    function restoreQuality() {
      let saved = 'free';
      try { saved = localStorage.getItem('aiQuality') || 'free'; } catch {}
      quality.value = saved;
      if (quality.value !== saved) quality.value = 'free';
    }
    restoreQuality();
    // Остальные бесплатные модели берём из OpenRouter; если не получилось — остаются два варианта.
    callFunction('grade', { action: 'models' }).then((r) => {
      if (!r.models || !r.models.length) return;
      const def = r.models.find((m) => m.id === r.defaultFree);
      if (def) quality.querySelector('option[value=free]').textContent = t('ai_model_free') + ': ' + def.name;
      const group = el('optgroup', { label: t('ai_model_free_more') },
        r.models.filter((m) => m.id !== r.defaultFree).map((m) => el('option', { value: 'free:' + m.id }, m.name)));
      quality.insertBefore(group, quality.querySelector('option[value=paid]'));
      restoreQuality();
    }).catch(() => {});
    quality.addEventListener('change', () => { try { localStorage.setItem('aiQuality', quality.value); } catch {} });

    document.getElementById('ai-all').addEventListener('click', () => {
      gradeWithAi(data.participants.filter((p) => p.submittedAt));
    });

    async function load() {
      data = await rpc('exam_results', { p_exam_id: id });
      document.getElementById('title').textContent = data.exam.title;
      document.title = data.exam.title + ' — ' + t('results');
      renderSummary();
      renderAnalysis();
      renderStudents();
      const meta = data.exam.className ? `${t('class_name')}: ${data.exam.className}` : '';
      document.getElementById('meta-summary').textContent = [meta, data.materials.length ? `${t('exam_materials')}: ${data.materials.length}` : ''].filter(Boolean).join(' · ');
      document.getElementById('ai-box').hidden = data.exam.type !== 'text' || !data.participants.some((p) => p.submittedAt);
    }

    requireLogin().then(load).then(async () => {
      const exam = await rpc('get_exam', { p_exam_id: id });
      await renderExamMeta(document.getElementById('meta'), exam);
    }).catch(showPageError);
  </script>
</body>
</html>
