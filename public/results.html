<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_results">Ответы и оценки — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script><script src="code-runner.js"></script>
</head>
<body>
  <main class="wrap">
    <p class="row"><a href="teacher.html" data-i18n="back"></a> · <a id="monitor-link" data-i18n="monitor"></a></p>
    <div class="card">
      <h1 id="title" style="margin:0 0 12px"></h1>
      <div id="summary"></div>
      <div id="ai-box" hidden style="margin-top:16px">
        <div class="row">
          <label class="row" style="margin:0"><span data-i18n="ai_model"></span>
            <select id="ai-quality">
              <option value="free" data-i18n="ai_model_free"></option>
              <option value="paid" data-i18n="ai_model_paid"></option>
              <option value="paid:gpt" data-i18n="ai_model_paid_gpt"></option>
            </select>
          </label>
        </div>
        <div id="ai-grade-box">
          <div class="row" style="margin-top:8px"><button id="ai-all" data-i18n="ai_grade_all"></button><span id="ai-msg" class="muted"></span></div>
          <p class="muted" data-i18n="ai_hint"></p>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="secondary" id="fb-all" data-i18n="fb_all"></button>
          <button class="secondary" id="fb-print-all" data-i18n="fb_print_all"></button>
          <span id="fb-msg" class="muted"></span>
        </div>
        <p class="muted" data-i18n="fb_hint"></p>
      </div>
      <div id="tests-box" hidden style="margin-top:16px">
        <div class="row"><button class="secondary" id="tests-all" data-i18n="code_tests_btn"></button><span id="tests-msg" class="muted"></span></div>
        <p class="muted" data-i18n="code_tests_hint_results"></p>
      </div>
    </div>
    <div class="card" id="analysis-card" hidden>
      <h2 data-i18n="class_analysis"></h2>
      <div id="analysis"></div>
    </div>
    <details class="card" id="meta-card">
      <summary><b data-i18n="class_and_materials"></b> <span class="muted" id="meta-summary"></span></summary>
      <div id="meta"></div>
    </details>
    <div class="row" id="students-tools" hidden style="margin-bottom:8px">
      <button class="secondary small" id="expand-all" data-i18n="expand_all"></button>
      <button class="secondary small" id="collapse-all" data-i18n="collapse_all"></button>
    </div>
    <div id="students"></div>
    <div class="error" id="err"></div>
  </main>
  <div id="print-area"></div>
  <script>
    const id = Number(new URLSearchParams(location.search).get('id'));
    document.getElementById('monitor-link').href = 'monitor.html?id=' + id;
    let data;

    function fmtScore(n) {
      return n === null || n === undefined ? '—' : String(Math.round(Number(n) * 100) / 100);
    }

    function sourceLabel(source) {
      return source ? t('by_' + source) : '';
    }

    function renderSummary() {
      const box = document.getElementById('summary');
      if (!data.participants.length) { box.replaceChildren(el('p', { class: 'muted' }, t('no_results'))); return; }
      const qn = data.questions.length;
      const head = el('tr', {}, [t('col_student'), t('col_status'), t('total'), t('graded')].map((h) => el('th', {}, h)));
      const rows = data.participants.map((p) => el('tr', {},
        el('td', {}, el('a', { href: '#p' + p.id }, p.name)),
        el('td', {}, p.submittedAt ? el('span', { class: 'badge submitted' }, t('st_submitted')) : el('span', { class: 'muted' }, t('not_submitted'))),
        el('td', {}, el('b', {}, fmtScore(p.total)), ` ${t('of')} ${data.maxScore}`),
        el('td', {}, `${p.gradedCount} / ${qn}`),
      ));
      box.replaceChildren(el('div', { class: 'table-scroll' }, el('table', {}, el('thead', {}, head), el('tbody', {}, rows))));
    }

    // Анализ класса по сданным и полностью оценённым работам.
    function renderAnalysis() {
      const card = document.getElementById('analysis-card');
      const qn = data.questions.length;
      const submitted = data.participants.filter((p) => p.submittedAt);
      const graded = submitted.filter((p) => p.gradedCount >= qn && data.maxScore > 0);
      card.hidden = !submitted.length;
      if (!submitted.length) return;
      const box = document.getElementById('analysis');
      if (!graded.length) { box.replaceChildren(el('p', { class: 'muted' }, t('analysis_wait'))); return; }

      const pcts = graded.map((p) => ({ name: p.name, id: p.id, pct: Number(p.total) * 100 / data.maxScore })).sort((a, b) => b.pct - a.pct);
      const avg = pcts.reduce((s, x) => s + x.pct, 0) / pcts.length;
      const mid = pcts.length % 2 ? pcts[(pcts.length - 1) / 2].pct : (pcts[pcts.length / 2 - 1].pct + pcts[pcts.length / 2].pct) / 2;
      const stat = (num, label, cls) => el('div', { class: 'stat' }, el('div', { class: 'num ' + (cls || '') }, num), el('div', { class: 'muted' }, label));

      const dist = [5, 4, 3, 2].map((g) => ({ g, n: pcts.filter((x) => gradeFor(x.pct) === g).length }));
      const bars = el('div', { class: 'bars' }, dist.map((d) => el('div', { class: 'bar-row' },
        el('span', {}, `«${d.g}» `, el('span', { class: 'muted' }, t('grade_range_' + d.g))),
        el('div', { class: 'bar g' + d.g }, el('span', { style: `width:${d.n * 100 / pcts.length}%` })),
        el('span', {}, String(d.n)))));

      // Средний процент по каждому вопросу: сначала самые трудные.
      const perQ = data.questions.map((q, i) => {
        const scores = graded.map((p) => p.answers[q.id] && p.answers[q.id].score).filter((v) => v !== undefined && v !== null);
        const pct = scores.length ? scores.reduce((s, v) => s + Number(v), 0) * 100 / (scores.length * q.points) : null;
        return { i, q, pct };
      }).sort((a, b) => (a.pct ?? 101) - (b.pct ?? 101));
      const qRows = perQ.map((x) => el('div', { class: 'bar-row' },
        el('span', { title: x.q.text }, `${t('question')} ${x.i + 1}`),
        el('div', { class: 'bar' }, el('span', { style: `width:${x.pct ?? 0}%` })),
        el('span', { class: pctClass(x.pct) }, fmtPct(x.pct))));
      const hardest = perQ.filter((x) => x.pct !== null && x.pct < 50);
      const weak = pcts.filter((x) => x.pct < 40);

      box.replaceChildren(...[
        el('div', { class: 'stats' },
          stat(fmtPct(avg), t('avg_result'), pctClass(avg)),
          stat(fmtPct(mid), t('median_result')),
          stat(`${fmtPct(pcts[0].pct)} / ${fmtPct(pcts[pcts.length - 1].pct)}`, t('best_worst')),
          stat(`${graded.length} / ${submitted.length}`, t('graded_works'))),
        graded.length < submitted.length ? el('p', { class: 'muted' }, t('analysis_partial')) : null,
        el('h3', {}, t('grade_distribution')), bars,
        el('h3', { style: 'margin-top:16px' }, t('per_question')), el('div', { class: 'bars' }, qRows),
        hardest.length ? el('p', {}, el('b', {}, t('hard_questions') + ': '),
          hardest.map((x) => `${x.i + 1}. ${x.q.text.length > 60 ? x.q.text.slice(0, 60) + '…' : x.q.text}`).join('; ')) : null,
        weak.length ? el('p', {}, el('b', {}, t('need_help') + ': '),
          ...weak.flatMap((x, k) => [k ? ', ' : '', el('a', { href: '#p' + x.id }, x.name), ` (${fmtPct(x.pct)})`])) : null,
      ].filter(Boolean));
    }

    function gradeForm(p, q, a) {
      const score = el('input', { type: 'number', min: 0, max: q.points, step: 0.5, style: 'width:90px' });
      if (a.score !== undefined) score.value = a.score;
      const comment = el('input', { type: 'text', placeholder: t('comment_placeholder') });
      comment.value = a.comment || '';
      const msg = el('span', { class: 'muted' }, sourceLabel(a.source));
      const save = el('button', { class: 'small', onclick: async () => {
        msg.className = 'muted'; msg.textContent = '';
        try {
          if (score.value === '') throw appError('invalid_score');
          await rpc('set_grade', { p_participant_id: p.id, p_question_id: q.id, p_score: Number(score.value), p_comment: comment.value });
          await load();
        } catch (err) { msg.className = 'error'; msg.textContent = err.message; }
      } }, t('save'));
      return el('div', {},
        el('div', { class: 'row', style: 'margin-top:8px' }, el('span', {}, t('score') + ':'), score, el('span', { class: 'muted' }, `${t('of')} ${q.points}`), save, msg),
        el('div', { style: 'margin-top:6px' }, comment));
    }

    function renderStudents() {
      const hasText = data.questions.some((q) => ['text', 'code'].includes(q.kind || 'text'));
      document.getElementById('students').replaceChildren(...data.participants.map((p) => {
        const items = data.questions.map((q, i) => {
          const a = p.answers[q.id] || {};
          const kind = q.kind || (data.exam.type === 'quiz' ? 'choice' : 'text');
          const parts = [el('div', { class: 'row spread' },
            el('b', {}, `${i + 1}. ${q.text}`),
            el('span', { class: 'muted' }, `${fmtScore(a.score)} / ${q.points}`))];
          if (kind === 'order') {
            const ok = a.value === q.options.map((_, k) => k).join(',');
            const mine = a.value ? a.value.split(',').map((k) => q.options[Number(k)]) : null;
            const list = (items, cls) => el('ol', { class: cls, style: 'margin:4px 0' }, items.map((x) => el('li', {}, x)));
            parts.push(el('p', { style: 'margin-bottom:0' }, `${t('student_order')}: `, mine ? el('span', { class: ok ? 'ok' : 'error' }, ok ? '✓' : '✗') : el('span', { class: 'muted' }, t('no_answer'))));
            if (mine) parts.push(list(mine, ok ? 'ok' : ''));
            if (!ok) parts.push(el('p', { class: 'muted', style: 'margin-bottom:0' }, `${t('correct_order')}:`), list(q.options, 'muted'));
          } else if (kind === 'code') {
            parts.push(el('p', { class: 'muted', style: 'margin:4px 0 0' }, el('span', { class: 'badge' }, CodeRunner.langName(q.lang)),
              q.tests && q.tests.length ? ' · ' + t('code_tests_count').replace('{n}', q.tests.length) : ''));
            parts.push(a.value ? el('pre', { class: 'code-view' }, a.value) : el('p', { class: 'muted' }, t('no_answer')));
            if (q.reference) parts.push(el('details', {}, el('summary', { class: 'muted' }, t('code_reference')), el('pre', { class: 'code-view' }, q.reference)));
            parts.push(gradeForm(p, q, a));
          } else if (kind !== 'text') {
            const chosen = a.value !== undefined && a.value !== null && a.value !== '' ? q.options[Number(a.value)] : null;
            const ok = a.value === String(q.correctIndex);
            parts.push(el('p', {}, `${t('answer')}: `, chosen == null ? el('span', { class: 'muted' }, t('no_answer')) : el('span', { class: ok ? 'ok' : 'error' }, (ok ? '✓ ' : '✗ ') + chosen)));
            if (!ok) parts.push(el('p', { class: 'muted' }, `${t('correct_answer')}: ${q.options[q.correctIndex]}`));
          } else {
            parts.push(a.value ? el('span', { class: 'snippet' }, a.value) : el('p', { class: 'muted' }, t('no_answer')));
            if (q.reference) parts.push(el('p', { class: 'muted' }, `${t('reference')}: ${q.reference}`));
            parts.push(gradeForm(p, q, a));
          }
          return el('div', { class: 'question' }, parts);
        });
        // Кнопка в заголовке не должна сворачивать и разворачивать карточку.
        const aiOne = hasText && p.submittedAt ? el('button', { class: 'secondary small', onclick: (e) => { e.preventDefault(); gradeWithAi([p], e.target); } }, t('ai_grade_one')) : null;
        const card = el('details', { class: 'card student', id: 'p' + p.id },
          el('summary', {},
            el('h2', {}, p.name),
            el('span', { class: 'row' },
              p.submittedAt ? null : el('span', { class: 'muted' }, t('not_submitted')),
              el('span', { class: 'muted' }, `${t('graded')}: ${p.gradedCount} / ${data.questions.length}`),
              aiOne, el('span', {}, el('b', {}, fmtScore(p.total)), ` ${t('of')} ${data.maxScore}`))),
          items, p.submittedAt ? feedbackForm(p) : null,
          el('div', { class: 'row', style: 'margin-top:12px; justify-content:flex-end' },
            el('button', { class: 'danger small', onclick: (e) => deleteStudent(p, e.target) }, t('delete_student'))));
        card.open = openCards.has(p.id);
        card.addEventListener('toggle', () => { if (card.open) openCards.add(p.id); else openCards.delete(p.id); });
        return card;
      }));
      document.getElementById('students-tools').hidden = !data.participants.length;
    }

    // Удаление ученика вместе с его ответами, оценками и отзывом.
    async function deleteStudent(p, button) {
      if (!confirm(t('delete_student_confirm').replace('{name}', p.name))) return;
      button.disabled = true;
      try {
        await rpc('delete_participant', { p_participant_id: p.id });
        openCards.delete(p.id);
        await load();
      } catch (err) {
        button.disabled = false;
        alert(err.message);
      }
    }

    // Карточки учеников свёрнуты; какие раскрыты — помним, пока открыта страница.
    const openCards = new Set();
    function openCard(pid) {
      const card = document.getElementById('p' + pid);
      if (card) { card.open = true; card.scrollIntoView({ block: 'start' }); }
    }
    // Ссылка на ученика (из таблицы или анализа класса) раскрывает его карточку.
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#p"]');
      if (!a) return;
      e.preventDefault();
      openCard(a.getAttribute('href').slice(2));
      history.replaceState(null, '', a.getAttribute('href'));
    });
    const setAll = (open) => document.querySelectorAll('#students details.student').forEach((d) => { d.open = open; });
    document.getElementById('expand-all').addEventListener('click', () => setAll(true));
    document.getElementById('collapse-all').addEventListener('click', () => setAll(false));

    // ---------- Отзыв ученику: составляет ИИ, учитель правит, копирует или печатает ----------
    const fbForms = new Map();

    function feedbackLabel(f) {
      return f ? t(f.source === 'ai' ? 'fb_by_ai' : 'fb_by_teacher') : '';
    }

    // Отзыв с шапкой: имя, экзамен, баллы — для копирования и печати.
    function feedbackSheet(p, text) {
      const score = t('fb_score_line').replace('{score}', fmtScore(p.total)).replace('{max}', data.maxScore);
      return { head: `${p.name} — ${data.exam.title}`, score, text };
    }

    function feedbackForm(p) {
      const box = el('textarea', { rows: 9, placeholder: t('fb_placeholder') });
      box.value = p.feedback ? p.feedback.text : '';
      const msg = el('span', { class: 'muted' }, feedbackLabel(p.feedback));
      const setMsg = (cls, text) => { msg.className = cls; msg.textContent = text; };
      const dirty = () => box.value.trim() !== (p.feedback ? p.feedback.text : '');
      box.addEventListener('input', () => setMsg('muted', dirty() ? t('fb_unsaved') : feedbackLabel(p.feedback)));
      const save = el('button', { class: 'small', onclick: async () => {
        try {
          p.feedback = await rpc('save_feedback', { p_participant_id: p.id, p_text: box.value });
          box.value = p.feedback ? p.feedback.text : '';
          setMsg('ok', p.feedback ? t('fb_by_teacher') : '');
        } catch (err) { setMsg('error', err.message); }
      } }, t('save'));
      const ai = el('button', { class: 'secondary small', onclick: () => {
        if (box.value.trim() && (dirty() || (p.feedback && p.feedback.source === 'teacher')) && !confirm(t('fb_confirm_replace'))) return;
        feedbackWithAi([p], true);
      } }, t(p.feedback ? 'fb_regen' : 'fb_ai_one'));
      const copy = el('button', { class: 'secondary small', onclick: async () => {
        const s = feedbackSheet(p, box.value.trim());
        try {
          await navigator.clipboard.writeText(`${s.head}\n${s.score}\n\n${s.text}`);
          setMsg('ok', t('fb_copied'));
        } catch {
          box.select();
          setMsg('error', t('fb_copy_failed'));
        }
      } }, t('fb_copy'));
      const print = el('button', { class: 'secondary small', onclick: () => printSheets([feedbackSheet(p, box.value.trim())]) }, t('fb_print'));
      fbForms.set(p.id, { box, setMsg, ai, p });
      return el('div', { class: 'question feedback' },
        el('h3', { style: 'margin:0 0 8px' }, t('fb_title')), box,
        el('div', { class: 'row', style: 'margin-top:8px' }, ai, save, copy, print, msg));
    }

    // Печать: каждый отзыв на отдельном листе.
    function printSheets(sheets) {
      sheets = sheets.filter((s) => s.text);
      if (!sheets.length) { alert(t('fb_none')); return; }
      const area = document.getElementById('print-area');
      area.replaceChildren(...sheets.map((s) => el('div', { class: 'sheet' },
        el('h2', {}, s.head), el('p', { class: 'muted' }, s.score), el('div', { class: 'sheet-text' }, s.text))));
      document.body.classList.add('printing');
      window.print();
      document.body.classList.remove('printing');
    }

    document.getElementById('fb-print-all').addEventListener('click', () => {
      printSheets(data.participants.filter((p) => fbForms.has(p.id)).map((p) => feedbackSheet(p, fbForms.get(p.id).box.value.trim())));
    });

    // Отзывы пишем по одному ученику; страницу не перерисовываем, чтобы не потерять несохранённые правки.
    async function feedbackWithAi(students, single) {
      if (aiRunning || testsRunning) return;
      aiRunning = true;
      const msg = document.getElementById('fb-msg');
      msg.className = 'muted';
      const buttons = document.querySelectorAll('#ai-all, #fb-all, #ai-quality, #students button');
      buttons.forEach((b) => { b.disabled = true; });
      let done = 0;
      try {
        for (let i = 0; i < students.length; i++) {
          const p = students[i];
          const form = fbForms.get(p.id);
          const progress = `${t('fb_generating')}: ${p.name} (${i + 1} / ${students.length})…`;
          msg.textContent = progress;
          if (form) form.setMsg('muted', t('fb_generating') + '…');
          const r = await callFunction('grade', { action: 'feedback', examId: id, participantId: p.id, quality: quality.value, lang: LANG });
          if (!r || !r.feedback) throw appError('invalid_request');
          p.feedback = r.feedback;
          if (form) {
            form.box.value = r.feedback.text;
            form.setMsg('muted', t('fb_by_ai'));
            form.ai.textContent = t('fb_regen');
          }
          done++;
        }
        msg.className = 'ok';
        msg.textContent = single ? '' : t('fb_done').replace('{n}', done);
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
        const form = fbForms.get(students[done] && students[done].id);
        if (form) form.setMsg('error', err.message);
      } finally {
        aiRunning = false;
        buttons.forEach((b) => { b.disabled = false; });
        refreshAiUsage();
      }
    }

    document.getElementById('fb-all').addEventListener('click', () => {
      // Готовые отзывы (ИИ или учителя) не перезаписываем.
      const todo = data.participants.filter((p) => p.submittedAt && !p.feedback);
      if (!todo.length) { const m = document.getElementById('fb-msg'); m.className = 'muted'; m.textContent = t('fb_all_ready'); return; }
      feedbackWithAi(todo, false);
    });

    // Проверка кода тестами учителя: код каждого ученика запускается здесь, в браузере.
    const clip = (s, n = 60) => {
      const one = String(s ?? '').replace(/\s+$/, '').replace(/\n/g, ' ⏎ ');
      return one.length > n ? one.slice(0, n) + '…' : one;
    };
    function testComment(r, tests) {
      if (r.compileError) return t('code_tests_compile').replace('{error}', clip(r.compileError, 300));
      const parts = [t('code_tests_summary').replace('{p}', r.passed).replace('{n}', r.total)];
      const i = r.details.findIndex((d) => !d.ok);
      if (i >= 0) {
        const d = r.details[i];
        if (d.timeout) parts.push(t('code_test_timeout').replace('{i}', i + 1));
        else if (d.error) parts.push(t('code_test_error').replace('{i}', i + 1).replace('{error}', clip(d.error.trim().split('\n').pop(), 200)));
        else parts.push(t('code_test_failed').replace('{i}', i + 1).replace('{input}', clip(tests[i].input))
          .replace('{expected}', clip(tests[i].output)).replace('{got}', clip(d.output)));
      }
      return parts.join(' ');
    }

    let testsRunning = false;
    async function runTests() {
      if (testsRunning || aiRunning) return;
      testsRunning = true;
      const msg = document.getElementById('tests-msg');
      const btn = document.getElementById('tests-all');
      msg.className = 'muted';
      btn.disabled = true;
      const qs = data.questions.filter((q) => q.kind === 'code' && q.tests && q.tests.length);
      const jobs = [];
      for (const p of data.participants.filter((x) => x.submittedAt)) {
        for (const q of qs) {
          const a = p.answers[q.id] || {};
          if (a.source !== 'teacher') jobs.push({ p, q, a });
        }
      }
      try {
        for (let i = 0; i < jobs.length; i++) {
          const { p, q, a } = jobs[i];
          const progress = t('code_tests_running').replace('{name}', p.name).replace('{i}', i + 1).replace('{n}', jobs.length);
          msg.textContent = progress;
          let grade;
          if (!(a.value || '').trim()) grade = { score: 0, comment: t('no_answer') };
          else {
            const r = await CodeRunner.check(q.lang, a.value, q.tests, (k) => { msg.textContent = k === 'code_running' ? progress : t(k); });
            grade = { score: q.points * r.passed / r.total, comment: testComment(r, q.tests) };
          }
          await rpc('save_test_grades', { p_exam_id: id, p_grades: [{ participantId: p.id, questionId: q.id, ...grade }] });
        }
        msg.className = 'ok';
        msg.textContent = t('code_tests_done').replace('{n}', jobs.length);
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
      } finally {
        testsRunning = false;
        btn.disabled = false;
        await load().catch(showPageError);
      }
    }
    document.getElementById('tests-all').addEventListener('click', runTests);

    // ИИ оценивает студентов по одному, чтобы каждый запрос был коротким.
    let aiRunning = false;
    async function gradeWithAi(students, button) {
      if (aiRunning) return;
      aiRunning = true;
      const msg = document.getElementById('ai-msg');
      msg.className = 'muted';
      document.querySelectorAll('#ai-all, #fb-all, #ai-quality, #students button').forEach((b) => { b.disabled = true; });
      try {
        for (let i = 0; i < students.length; i++) {
          msg.textContent = `${t('ai_grading')}: ${students[i].name} (${i + 1} / ${students.length})…`;
          await callFunction('grade', { examId: id, participantId: students[i].id, quality: quality.value, lang: LANG });
        }
        msg.className = 'ok';
        msg.textContent = t('ai_done');
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
      } finally {
        aiRunning = false;
        await load().catch(showPageError);
        refreshAiUsage();
        document.getElementById('ai-all').disabled = false;
        document.getElementById('fb-all').disabled = false;
        quality.disabled = false;
        if (button) document.getElementById('ai-box').scrollIntoView({ block: 'nearest' });
      }
    }

    // Модель ИИ: бесплатная по умолчанию, выбор запоминается в браузере.
    const quality = document.getElementById('ai-quality');
    function restoreQuality() {
      let saved = 'free';
      try { saved = localStorage.getItem('aiQuality') || 'free'; } catch {}
      quality.value = saved;
      if (quality.value !== saved) quality.value = 'free';
    }
    restoreQuality();
    // Остальные бесплатные модели берём из OpenRouter; если не получилось — остаются два варианта.
    callFunction('grade', { action: 'models' }).then((r) => {
      if (!r.models || !r.models.length) return;
      const def = r.models.find((m) => m.id === r.defaultFree);
      if (def) quality.querySelector('option[value=free]').textContent = t('ai_model_free') + ': ' + def.name;
      const group = el('optgroup', { label: t('ai_model_free_more') },
        r.models.filter((m) => m.id !== r.defaultFree).map((m) => el('option', { value: 'free:' + m.id }, m.name)));
      quality.insertBefore(group, quality.querySelector('option[value=paid]'));
      restoreQuality();
    }).catch(() => {});
    quality.addEventListener('change', () => { try { localStorage.setItem('aiQuality', quality.value); } catch {} });

    document.getElementById('ai-all').addEventListener('click', () => {
      gradeWithAi(data.participants.filter((p) => p.submittedAt));
    });

    async function load() {
      data = await rpc('exam_results', { p_exam_id: id });
      document.getElementById('title').textContent = data.exam.title;
      document.title = data.exam.title + ' — ' + t('results');
      renderSummary();
      renderAnalysis();
      // Несохранённые правки отзывов переживают перерисовку.
      const drafts = new Map([...fbForms].filter(([, f]) => f.box.value.trim() !== (f.p.feedback ? f.p.feedback.text : ''))
        .map(([pid, f]) => [pid, f.box.value]));
      fbForms.clear();
      renderStudents();
      for (const [pid, text] of drafts) {
        const f = fbForms.get(pid);
        if (f) { f.box.value = text; f.setMsg('muted', t('fb_unsaved')); }
      }
      const meta = data.exam.className ? `${t('class_name')}: ${data.exam.className}` : '';
      document.getElementById('meta-summary').textContent = [meta, data.materials.length ? `${t('exam_materials')}: ${data.materials.length}` : ''].filter(Boolean).join(' · ');
      const anySubmitted = data.participants.some((p) => p.submittedAt);
      document.getElementById('ai-box').hidden = !anySubmitted;
      document.getElementById('ai-grade-box').hidden = !data.questions.some((q) => q.kind === 'text' || q.kind === 'code');
      document.getElementById('tests-box').hidden = !data.questions.some((q) => q.kind === 'code' && q.tests && q.tests.length) || !anySubmitted;
    }

    requireLogin().then(load).then(async () => {
      if (/^#p\d+$/.test(location.hash)) openCard(location.hash.slice(2));
      const exam = await rpc('get_exam', { p_exam_id: id });
      await renderExamMeta(document.getElementById('meta'), exam);
    }).catch(showPageError);
  </script>
</body>
</html>
