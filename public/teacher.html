<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title_teacher">Мои экзамены — AI Marker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script>
  <script src="teacher-common.js"></script>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h2 data-i18n="new_exam"></h2>
      <form id="new-exam">
        <label for="title" data-i18n="exam_title"></label>
        <input type="text" id="title" required>
        <div class="type-choice">
          <label><input type="radio" name="type" value="quiz" checked><b data-i18n="type_quiz"></b><br><span class="muted" data-i18n="type_quiz_hint"></span></label>
          <label><input type="radio" name="type" value="text"><b data-i18n="type_text"></b><br><span class="muted" data-i18n="type_text_hint"></span></label>
          <label><input type="radio" name="type" value="mixed"><b data-i18n="type_mixed"></b><br><span class="muted" data-i18n="type_mixed_hint"></span></label>
        </div>
        <label class="check"><input type="checkbox" id="shuffle"> <span data-i18n="shuffle_label"></span></label>
        <p class="muted small" data-i18n="shuffle_hint"></p>
        <div class="error" id="err"></div>
        <button type="submit" data-i18n="create"></button>
      </form>
    </div>
    <div class="card">
      <h2 data-i18n="my_exams"></h2>
      <div id="list"></div>
    </div>
  </main>
  <script>
    async function load() {
      const exams = await rpc('list_exams');
      const list = document.getElementById('list');
      list.replaceChildren();
      if (!exams.length) { list.append(el('p', { class: 'muted' }, t('no_exams'))); return; }
      const rows = exams.map((x) => el('tr', {},
        el('td', {}, el('b', {}, x.title), el('br'), el('span', { class: 'muted' }, t('type_' + x.type),
          x.className ? ` · ${t('class_name')} ${x.className}` : '')),
        el('td', {}, el('span', { class: 'badge ' + x.status }, t('status_' + x.status))),
        el('td', {}, x.code ? el('code', {}, x.code) : '—'),
        el('td', {}, `${t('participants')}: ${x.participantCount}`),
        el('td', {}, el('span', { class: 'row' },
          ...(x.status === 'draft'
            ? [el('a', { href: 'edit.html?id=' + x.id }, t('open'))]
            : [el('a', { href: 'monitor.html?id=' + x.id }, t('monitor')), el('a', { href: 'results.html?id=' + x.id }, t('results'))]),
          el('button', { type: 'button', class: 'secondary small', title: t('copy_exam_hint'), onclick: () => copyExam(x) }, t('copy_exam')),
          el('button', { type: 'button', class: 'danger small', onclick: () => deleteExam(x) }, t('remove')))),
      ));
      list.append(el('div', { class: 'table-scroll' }, el('table', {}, el('tbody', {}, rows))));
    }
    // Удаление экзамена со всеми ответами. Если ученики уже писали, просим ввести название.
    async function deleteExam(x) {
      if (x.participantCount > 0) {
        const typed = prompt(t('delete_exam_typed').replace('{n}', x.participantCount).replace('{title}', x.title));
        if (typed === null) return;
        if (typed.trim() !== x.title.trim()) { alert(t('delete_exam_mismatch')); return; }
      } else if (!confirm(t('delete_exam_q'))) return;
      try {
        await rpc('delete_exam', { p_exam_id: x.id });
        await load();
      } catch (err) { document.getElementById('err').textContent = err.message; }
    }
    // Копия экзамена открывается в редакторе как новый черновик.
    async function copyExam(x) {
      const suggested = `${x.title} ${t('copy_suffix')}`;
      const title = prompt(t('copy_exam_q'), suggested);
      if (title === null) return;
      try {
        const exam = await rpc('copy_exam', { p_exam_id: x.id, p_title: title.trim() || suggested });
        location.href = 'edit.html?id=' + exam.id;
      } catch (err) { document.getElementById('err').textContent = err.message; }
    }
        document.getElementById('new-exam').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const exam = await rpc('create_exam', {
          p_title: document.getElementById('title').value,
          p_type: document.querySelector('input[name=type]:checked').value,
          p_shuffle: document.getElementById('shuffle').checked,
        });
        location.href = 'edit.html?id=' + exam.id;
      } catch (err) { document.getElementById('err').textContent = err.message; }
    });
    requireLogin().then(load).catch((err) => { document.getElementById('err').textContent = err.message; });
  </script>
</body>
</html>
